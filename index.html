<html lang="en">
<head>
<meta charset="UTF-8">

<title>ArogyaDrill | Adaptive micro-learning for frontline health workers</title>
<meta name="description" content="English, Hindi and Kannada. An offline-first, adaptive drill app that trains ASHA, ANM and nursing students on life-saving maternal, child, nutrition, communicable-disease, emergency and NCD protocols using spaced repetition.">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230f766e'/><path d='M14 34h10l5-12 8 24 6-12h7' stroke='white' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root{
  --bg:#f2f6f5; --card:#ffffff; --ink:#0f2b28; --muted:#5b7470; --line:#dbe7e4;
  --teal:#0f766e; --teal-d:#115e56; --teal-l:#d9f0ec; --amber:#b45309; --amber-l:#fef3c7;
  --red:#b91c1c; --red-l:#fee2e2; --green:#15803d; --green-l:#dcfce7;
  --radius:16px; --shadow:0 1px 2px rgba(15,43,40,.06),0 8px 24px rgba(15,43,40,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans','Noto Sans Devanagari','Noto Sans Kannada',sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:20;background:rgba(242,246,245,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:12px 16px}
.topin{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo svg{flex:none}
.logo .t{font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.logo .s{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langbtn{border:1.5px solid var(--teal);color:var(--teal);background:#fff;font-weight:700;font-size:.8rem;
  padding:7px 12px;border-radius:999px;cursor:pointer;flex:none}
.langbtn.on{background:var(--teal);color:#fff}
nav.tabs{display:flex;gap:6px;padding:12px 0 4px;overflow-x:auto}
.tab{flex:1;min-width:72px;text-align:center;border:none;background:transparent;color:var(--muted);
  font-weight:700;font-size:.85rem;padding:10px 6px;border-radius:12px;cursor:pointer}
.tab.active{background:var(--teal);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-top:14px}
h2.vh{font-size:1.25rem;margin:18px 0 2px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:.88rem}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px 18px;font-size:1rem;font-weight:800;
  cursor:pointer;text-align:center;letter-spacing:.01em}
.btn.primary{background:var(--teal);color:#fff;box-shadow:0 6px 18px rgba(15,118,110,.28)}
.btn.primary:active{transform:translateY(1px)}
.btn.ghost{background:var(--teal-l);color:var(--teal-d)}
.btn.small{padding:10px 14px;font-size:.88rem;border-radius:10px}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat .n{font-size:1.5rem;font-weight:800;color:var(--teal-d)}
.stat .l{font-size:.7rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{--p:0;width:84px;height:84px;border-radius:50%;flex:none;
  background:conic-gradient(var(--teal) calc(var(--p)*1%), #e3eeec 0);
  display:grid;place-items:center}
.ring i{width:64px;height:64px;background:var(--card);border-radius:50%;display:grid;place-items:center;
  font-style:normal;font-weight:800;font-size:1.05rem;color:var(--teal-d)}
.topic{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px;margin-top:10px;box-shadow:var(--shadow)}
.topic .em{width:44px;height:44px;border-radius:12px;background:var(--teal-l);display:grid;place-items:center;font-size:1.3rem;flex:none}
.topic .tx{flex:1;min-width:0}
.topic .tx b{display:block;font-size:.98rem}
.topic .tx span{font-size:.75rem;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:#e3eeec;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--teal);width:0%}
.chip{display:inline-block;font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:99px;letter-spacing:.02em}
.chip.due{background:var(--amber-l);color:var(--amber)}
.chip.new{background:var(--teal-l);color:var(--teal-d)}
.chip.ok{background:var(--green-l);color:var(--green)}
/* drill overlay */
#drill{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
#drill.open{display:flex}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 16px}
.dhead button{border:none;background:transparent;font-size:1.4rem;cursor:pointer;color:var(--muted);padding:4px 8px}
.dprog{flex:1;height:6px;background:#e3eeec;border-radius:99px;overflow:hidden}
.dprog i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:.85rem;color:var(--muted);flex:none;width:44px;text-align:right}
.dbody{flex:1;overflow-y:auto;padding:6px 18px 24px;max-width:720px;margin:0 auto;width:100%}
.qtopic{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);margin-bottom:8px}
.qtext{font-size:1.18rem;font-weight:750;line-height:1.45;letter-spacing:-.01em}
.opts{margin-top:18px;display:grid;gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font-size:.98rem;
  cursor:pointer;text-align:left;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.opt b.k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--teal-l);color:var(--teal-d);
  display:grid;place-items:center;font-size:.8rem}
.opt.pick{border-color:var(--teal)}
.opt.correct{border-color:var(--green);background:var(--green-l)}
.opt.wrong{border-color:var(--red);background:var(--red-l)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;font-size:.92rem;line-height:1.55;display:none}
.fb.good{background:var(--green-l);color:#14532d}
.fb.bad{background:var(--red-l);color:#7f1d1d}
.fb .ttl{font-weight:800;margin-bottom:4px}
.dfoot{padding:12px 16px calc(16px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;width:100%}
/* log */
.logrow{border-top:1px solid var(--line);padding:12px 2px;font-size:.9rem}
.logrow:first-child{border-top:none}
.logrow .why{color:var(--muted);font-size:.8rem;margin-top:3px}
.hidden{display:none!important}
.about p{margin-top:10px;font-size:.93rem}
.about b{font-weight:800}
.disc{background:var(--amber-l);border:1px solid #f3d9a4;color:#7c4a03;border-radius:12px;padding:12px;font-size:.85rem;margin-top:12px}
footer{text-align:center;color:var(--muted);font-size:.75rem;padding:26px 0 8px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:99px;font-size:.85rem;font-weight:700;z-index:80;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media(min-width:560px){ .qtext{font-size:1.3rem} }
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0f766e"/><path d="M14 34h10l5-12 8 24 6-12h7" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><div class="t">ArogyaDrill</div><div class="s" data-i18n="tag"></div></div>
  </div>
  <button class="langbtn" id="langbtn" onclick="toggleLang()" aria-label="Change language">EN · हिं · ಕ</button>
</div></header>

<div class="wrap">
<nav class="tabs">
  <button class="tab active" id="tab-today" onclick="show('today')" data-i18n="navToday"></button>
  <button class="tab" id="tab-topics" onclick="show('topics')" data-i18n="navTopics"></button>
  <button class="tab" id="tab-progress" onclick="show('progress')" data-i18n="navProgress"></button>
  <button class="tab" id="tab-about" onclick="show('about')" data-i18n="navAbout"></button>
</nav>

<section id="view-today">
  <h2 class="vh" data-i18n="todayTitle"></h2>
  <div class="sub" id="todaySub"></div>
  <div class="statrow">
    <div class="stat"><div class="n" id="stDue">0</div><div class="l" data-i18n="dueLabel"></div></div>
    <div class="stat"><div class="n" id="stNew">0</div><div class="l" data-i18n="newLabel"></div></div>
    <div class="stat"><div class="n" id="stStreak">0</div><div class="l" data-i18n="streakLabel"></div></div>
  </div>
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div><b data-i18n="goalLabel"></b><div class="sub" data-i18n="goalSub"></div></div>
      <select id="goalSel" onchange="setGoal(this.value)" style="border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700;color:var(--teal-d);background:#fff">
        <option>5</option><option selected>10</option><option>15</option><option>20</option>
      </select>
    </div>
  </div>
  <div class="card">
    <button class="btn primary" id="startBtn" onclick="startToday()" data-i18n="startBtn"></button>
    <div class="sub" style="margin-top:10px;text-align:center" id="queueNote"></div>
  </div>
</section>

<section id="view-topics" class="hidden">
  <h2 class="vh" data-i18n="topicsTitle"></h2>
  <div class="sub" data-i18n="topicsSub"></div>
  <div id="topicList"></div>
</section>

<section id="view-progress" class="hidden">
  <h2 class="vh" data-i18n="progTitle"></h2>
  <div class="statrow">
    <div class="stat"><div class="n" id="pgAcc">–</div><div class="l" data-i18n="accLabel"></div></div>
    <div class="stat"><div class="n" id="pgSeen">0</div><div class="l" data-i18n="seenLabel"></div></div>
    <div class="stat"><div class="n" id="pgMast">0</div><div class="l" data-i18n="masteryLabel"></div></div>
  </div>
  <div class="card" style="margin-top:14px"><b data-i18n="mistakesTitle"></b><div id="logList"></div>
    <button class="btn ghost small" style="margin-top:12px" onclick="drillErrors()" id="logBtn" data-i18n="redoBtn"></button>
  </div>
</section>

<section id="view-about" class="hidden about">
  <h2 class="vh" data-i18n="aboutTitle"></h2>
  <div class="card">
    <p data-i18n="aboutP1"></p>
    <p data-i18n="aboutP2"></p>
    <p data-i18n="aboutP3"></p>
    <p data-i18n="aboutP4"></p>
  </div>
  <div class="disc" data-i18n="disc"></div>
  <footer data-i18n="foot"></footer>
</section>
</div>

<div id="drill">
  <div class="dhead">
    <button onclick="endDrill()" aria-label="close">✕</button>
    <div class="dprog"><i id="dprog" style="width:0%"></i></div>
    <div class="timer" id="dtimer">1:00</div>
  </div>
  <div class="dbody">
    <div class="qtopic" id="dqTopic"></div>
    <div class="qtext" id="dqText"></div>
    <div class="opts" id="dqOpts"></div>
    <div class="fb" id="dqFb"></div>
  </div>
  <div class="dfoot"><button class="btn primary hidden" id="nextBtn" onclick="nextQ()"></button></div>
</div>
<div class="toast" id="toast"></div>

<script>
const QUESTIONS = [{"id": "maternal-1", "topic": "maternal", "q": "A pregnant woman is registered at your sub-centre at 9 weeks. As per national guidelines, what is the MINIMUM number of ANC (antenatal) check-ups she should complete?", "o": ["Two", "Three", "Four", "Eight"], "a": 2, "why": "MoHFW/NHM recommends a minimum of 4 ANC visits, with the first within the first 12 weeks. (WHO's 2016 guideline suggests 8 contacts; India's programme minimum remains 4.)", "hi": {"q": "एक गर्भवती महिला 9 हफ्ते पर उप-केंद्र में पंजीकृत होती है। राष्ट्रीय दिशानिर्देशों के अनुसार उसे कम से कम कितनी प्रसव-पूर्व (ANC) जांचें करानी चाहिए?", "o": ["दो", "तीन", "चार", "आठ"], "a": 2, "why": "MoHFW/NHM कम से कम 4 ANC जांचों की सलाह देता है, पहली जांच पहले 12 हफ्तों में। (WHO 2016 दिशानिर्देश 8 संपर्क सुझाता है; भारत के कार्यक्रम में न्यूनतम 4 ही है।)"}, "kn": {"q": "ಒಬ್ಬ ಗರ್ಭಿಣಿ 9ನೇ ವಾರದಲ್ಲಿ ನಿಮ್ಮ ಉಪಕೇಂದ್ರದಲ್ಲಿ ನೋಂದಾಯಿಸಿದ್ದಾರೆ. ರಾಷ್ಟ್ರೀಯ ಮಾರ್ಗಸೂಚಿ ಪ್ರಕಾರ ಅವರು ಕನಿಷ್ಠ ಎಷ್ಟು ANC (ಪ್ರಸವಪೂರ್ವ) ತಪಾಸಣೆ ಮಾಡಿಸಬೇಕು?", "o": ["ಎರಡು", "ಮೂರು", "ನಾಲ್ಕು", "ಎಂಟು"], "why": "MoHFW/NHM ಕನಿಷ್ಠ 4 ANC ಭೇಟಿಗಳನ್ನು ಶಿಫಾರಸು ಮಾಡುತ್ತದೆ; ಮೊದಲನೆಯದು ಮೊದಲ 12 ವಾರಗಳೊಳಗೆ. (WHO 2016 ಮಾರ್ಗಸೂಚಿ 8 ಭೇಟಿ ಹೇಳುತ್ತದೆ; ಭಾರತದ ಕಾರ್ಯಕ್ರಮದ ಕನಿಷ್ಠ 4.)", "a": 2}}, {"id": "maternal-2", "topic": "maternal", "q": "Which of these is a pregnancy DANGER sign that needs immediate referral?", "o": ["Mild swelling of ankles in the evening", "Blurred vision with severe headache", "Heartburn after meals", "Passing urine more often than usual"], "a": 1, "why": "Severe headache with blurred vision suggests rising blood pressure / pre-eclampsia, which can progress to eclampsia and fits. It needs urgent referral, not observation at home.", "hi": {"q": "गर्भावस्था में निम्न में से कौन-सा खतरे का संकेत है जिसमें तुरंत रेफर करना जरूरी है?", "o": ["शाम को पैरों में हल्की सूजन", "तेज़ सिरदर्द के साथ धुँधला दिखना", "खाने के बाद जलन", "पेशाब अधिक बार आना"], "a": 1, "why": "तेज़ सिरदर्द और धुँधला दिखना बढ़ते ब्लड प्रेशर (प्री-एक्लैम्पसिया) का संकेत है, जो दौरों (एक्लैम्पसिया) तक बढ़ सकता है। तुरंत रेफर करें।"}, "kn": {"q": "ಇವುಗಳಲ್ಲಿ ತಕ್ಷಣ ರೆಫರ್ ಮಾಡಬೇಕಾದ ಗರ್ಭಾವಸ್ಥೆಯ ಅಪಾಯದ ಲಕ್ಷಣ ಯಾವುದು?", "o": ["ಸಂಜೆ ಕಾಲು ಮಣಿಗಂಟಿನಲ್ಲಿ ಸ್ವಲ್ಪ ಊತ", "ತೀವ್ರ ತಲೆನೋವಿನೊಂದಿಗೆ ಮಸುಕಾದ ದೃಷ್ಟಿ", "ಊಟದ ನಂತರ ಎದೆಯುರಿ", "ಸಾಮಾನ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚು ಬಾರಿ ಮೂತ್ರ"], "why": "ತೀವ್ರ ತಲೆನೋವು ಮತ್ತು ಮಸುಕಾದ ದೃಷ್ಟಿ ರಕ್ತದೊತ್ತಡ ಏರಿಕೆ / ಪ್ರೀ-ಎಕ್ಲಾಂಪ್ಸಿಯಾದ ಸೂಚನೆ; ಇದು ಎಕ್ಲಾಂಪ್ಸಿಯಾ ಮತ್ತು ಸೆಳೆತಕ್ಕೆ ತಿರುಗಬಹುದು. ಮನೆಯಲ್ಲಿ ನೋಡುತ್ತಾ ಇರದೆ ತಕ್ಷಣ ರೆಫರ್ ಮಾಡಿ.", "a": 1}}, {"id": "maternal-3", "topic": "maternal", "q": "A woman starts bleeding heavily after the placenta is delivered at a home birth. What is the FIRST priority?", "o": ["Give her sweet tea and observe", "Wait 30 minutes to see if bleeding stops", "Arrange immediate referral and keep her warm with blankets", "Give her a bath and change clothes"], "a": 2, "why": "Heavy postpartum bleeding (PPH) is a leading cause of maternal death. The correct action is immediate referral while keeping the woman warm and continuing to massage-support per local protocol.", "hi": {"q": "घर पर प्रसव के बाद आँवल (प्लेसेंटा) निकलते ही महिला को बहुत ज़्यादा खून बहने लगता है। सबसे पहली प्राथमिकता क्या है?", "o": ["मीठी चाय देकर देखते रहें", "30 मिनट रुककर देखें कि खून रुकता है या नहीं", "तुरंत रेफर की व्यवस्था करें और कंबल से गर्म रखें", "नहलाकर कपड़े बदलें"], "a": 2, "why": "प्रसव के बाद ज़्यादा रक्तस्राव (PPH) मातृ मृत्यु का प्रमुख कारण है। सही कदम है तुरंत रेफर करना, महिला को गर्म रखना और स्थानीय प्रोटोकॉल के अनुसार गर्भाशय की मालिश जारी रखना।"}, "kn": {"q": "ಮನೆ ಹೆರಿಗೆಯಲ್ಲಿ ಮಾಸು (ಪ್ಲಾಸೆಂಟಾ) ಹೊರಬಂದ ನಂತರ ಮಹಿಳೆಗೆ ಅತಿಯಾದ ರಕ್ತಸ್ರಾವ ಶುರುವಾಗಿದೆ. ಮೊದಲ ಆದ್ಯತೆ ಏನು?", "o": ["ಸಿಹಿ ಚಹಾ ಕೊಟ್ಟು ಗಮನಿಸಿ", "ರಕ್ತಸ್ರಾವ ನಿಲ್ಲುತ್ತದೆಯೇ ಎಂದು 30 ನಿಮಿಷ ಕಾಯಿರಿ", "ತಕ್ಷಣ ರೆಫರಲ್ ವ್ಯವಸ್ಥೆ ಮಾಡಿ, ಕಂಬಳಿಯಿಂದ ಬೆಚ್ಚಗಿಡಿ", "ಸ್ನಾನ ಮಾಡಿಸಿ ಬಟ್ಟೆ ಬದಲಿಸಿ"], "why": "ಹೆರಿಗೆ ನಂತರದ ಅತಿಯಾದ ರಕ್ತಸ್ರಾವ (PPH) ತಾಯಿ ಸಾವಿಗೆ ಮುಖ್ಯ ಕಾರಣ. ಮಹಿಳೆಯನ್ನು ಬೆಚ್ಚಗಿಟ್ಟು, ಸ್ಥಳೀಯ ಪ್ರೋಟೋಕಾಲ್ ಪ್ರಕಾರ ಮಸಾಜ್ ಬೆಂಬಲ ಮುಂದುವರಿಸಿ, ತಕ್ಷಣ ರೆಫರ್ ಮಾಡುವುದು ಸರಿ.", "a": 2}}, {"id": "maternal-4", "topic": "maternal", "q": "When should the FIRST ANC check-up ideally happen?", "o": ["As soon as pregnancy is suspected, within the first 12 weeks", "In the 5th month", "In the 7th month", "Only when problems appear"], "a": 0, "why": "Early registration in the first trimester allows baseline haemoglobin, blood pressure, weight and Td vaccination to be completed in time.", "hi": {"q": "पहली ANC जांच आदर्श रूप से कब होनी चाहिए?", "o": ["गर्भ का संदेह होते ही, पहले 12 हफ्तों के भीतर", "पाँचवें महीने में", "सातवें महीने में", "केवल समस्या होने पर"], "a": 0, "why": "पहली तिमाही में जल्दी पंजीकरण से हीमोग्लोबिन, ब्लड प्रेशर, वज़न की आधार जांच और Td टीका समय पर हो जाते हैं।"}, "kn": {"q": "ಮೊದಲ ANC ತಪಾಸಣೆ ಯಾವಾಗ ಆಗಬೇಕು?", "o": ["ಗರ್ಭ ಎಂದು ಸಂಶಯ ಬಂದ ತಕ್ಷಣ, ಮೊದಲ 12 ವಾರಗಳೊಳಗೆ", "5ನೇ ತಿಂಗಳಲ್ಲಿ", "7ನೇ ತಿಂಗಳಲ್ಲಿ", "ಸಮಸ್ಯೆ ಬಂದಾಗ ಮಾತ್ರ"], "why": "ಮೊದಲ ತ್ರೈಮಾಸಿಕದಲ್ಲೇ ನೋಂದಣಿ ಮಾಡಿದರೆ ಹಿಮೋಗ್ಲೋಬಿನ್, ರಕ್ತದೊತ್ತಡ, ತೂಕ ಮತ್ತು Td ಲಸಿಕೆ ಸಮಯಕ್ಕೆ ಆಗುತ್ತವೆ.", "a": 0}}, {"id": "maternal-5", "topic": "maternal", "q": "Under Anemia Mukt Bharat, for how many days should a pregnant woman receive iron-folic acid (IFA) tablets?", "o": ["30 days", "100 days", "180 days", "365 days"], "a": 2, "why": "Pregnant women receive IFA for 180 days (6 months) after the first trimester begins, along with deworming where advised.", "hi": {"q": "एनीमिया मुक्त भारत के तहत गर्भवती महिला को आयरन-फोलिक एसिड (IFA) की गोलियाँ कितने दिन मिलनी चाहिए?", "o": ["30 दिन", "100 दिन", "180 दिन", "365 दिन"], "a": 2, "why": "पहली तिमाही के बाद से गर्भवती महिलाओं को 180 दिन (6 महीने) IFA दी जाती है, और जहाँ सलाह हो वहाँ कृमिनाशक भी।"}, "kn": {"q": "ಅನೀಮಿಯಾ ಮುಕ್ತ ಭಾರತದ ಅಡಿ ಗರ್ಭಿಣಿಗೆ ಎಷ್ಟು ದಿನ ಕಬ್ಬಿಣ-ಫೋಲಿಕ್ ಆಮ್ಲ (IFA) ಮಾತ್ರೆ ಕೊಡಬೇಕು?", "o": ["30 ದಿನ", "100 ದಿನ", "180 ದಿನ", "365 ದಿನ"], "why": "ಮೊದಲ ತ್ರೈಮಾಸಿಕದ ನಂತರ ಗರ್ಭಿಣಿಯರಿಗೆ 180 ದಿನ (6 ತಿಂಗಳು) IFA ಕೊಡಲಾಗುತ್ತದೆ; ಸಲಹೆ ಇದ್ದಲ್ಲಿ ಜಂತುಹುಳು ನಿವಾರಣೆ ಕೂಡ.", "a": 2}}, {"id": "maternal-6", "topic": "maternal", "q": "A pregnant woman has never received a Td (tetanus-diphtheria) vaccine and has no records. What should she be given?", "o": ["Nothing during pregnancy", "Two doses of Td at least 4 weeks apart", "One dose at delivery", "Td is only for children"], "a": 1, "why": "For previously unimmunised pregnant women, 2 doses of Td at least 4 weeks apart are recommended, the first as early in pregnancy as possible.", "hi": {"q": "एक गर्भवती महिला को कभी Td (टिटनेस-डिप्थीरिया) का टीका नहीं लगा और कोई रिकॉर्ड नहीं है। उसे क्या दिया जाना चाहिए?", "o": ["गर्भावस्था में कुछ नहीं", "Td की दो खुराक, कम से कम 4 हफ्ते के अंतर पर", "प्रसव के समय एक खुराक", "Td केवल बच्चों के लिए है"], "a": 1, "why": "जिन गर्भवती महिलाओं को पहले टीका नहीं लगा, उन्हें Td की 2 खुराक कम से कम 4 हफ्ते के अंतर पर दी जाती हैं; पहली खुराक गर्भावस्था में जितनी जल्दी हो सके।"}, "kn": {"q": "ಒಬ್ಬ ಗರ್ಭಿಣಿ ಎಂದೂ Td (ಟೆಟನಸ್-ಡಿಫ್ತೀರಿಯಾ) ಲಸಿಕೆ ಪಡೆದಿಲ್ಲ, ದಾಖಲೆಯೂ ಇಲ್ಲ. ಅವರಿಗೆ ಏನು ಕೊಡಬೇಕು?", "o": ["ಗರ್ಭಾವಸ್ಥೆಯಲ್ಲಿ ಏನೂ ಬೇಡ", "ಕನಿಷ್ಠ 4 ವಾರಗಳ ಅಂತರದಲ್ಲಿ Td ಎರಡು ಡೋಸ್", "ಹೆರಿಗೆ ವೇಳೆ ಒಂದು ಡೋಸ್", "Td ಮಕ್ಕಳಿಗೆ ಮಾತ್ರ"], "why": "ಹಿಂದೆ ಲಸಿಕೆ ಪಡೆಯದ ಗರ್ಭಿಣಿಯರಿಗೆ ಕನಿಷ್ಠ 4 ವಾರಗಳ ಅಂತರದಲ್ಲಿ Td 2 ಡೋಸ್; ಮೊದಲನೆಯದು ಗರ್ಭಾವಸ್ಥೆಯಲ್ಲಿ ಆದಷ್ಟು ಬೇಗ.", "a": 1}}, {"id": "maternal-7", "topic": "maternal", "q": "Why should breastfeeding start within the first hour after birth?", "o": ["It helps the mother sleep", "Colostrum is rich in antibodies and lowers newborn deaths", "It makes the baby hungry later", "There is no particular benefit"], "a": 1, "why": "Early initiation gives colostrum (rich in antibodies), establishes feeding, and is associated with reduced neonatal mortality. Prelacteal feeds like honey or ghutti must be avoided.", "hi": {"q": "जन्म के पहले घंटे के भीतर स्तनपान क्यों शुरू करना चाहिए?", "o": ["इससे माँ को नींद आती है", "पहला गाढ़ा दूध (कोलोस्ट्रम) एंटीबॉडी से भरपूर होता है और नवजात मृत्यु घटाता है", "इससे बच्चे को बाद में भूख लगती है", "इसका कोई खास फायदा नहीं"], "a": 1, "why": "जल्दी स्तनपान से कोलोस्ट्रम (एंटीबॉडी से भरपूर) मिलता है, दूध पिलाना जम जाता है और नवजात मृत्यु कम होती है। शहद या घुट्टी जैसे पूर्व-आहार नहीं देने चाहिए।"}, "kn": {"q": "ಹುಟ್ಟಿದ ಮೊದಲ ಗಂಟೆಯೊಳಗೆ ಎದೆಹಾಲು ಏಕೆ ಶುರು ಮಾಡಬೇಕು?", "o": ["ತಾಯಿಗೆ ನಿದ್ದೆ ಬರಲು", "ಗಿಣ್ಣುಹಾಲಿನಲ್ಲಿ (ಕೊಲೊಸ್ಟ್ರಮ್) ಪ್ರತಿಕಾಯಗಳು ಹೆಚ್ಚು, ನವಜಾತ ಸಾವು ಕಡಿಮೆ ಮಾಡುತ್ತದೆ", "ಮಗುವಿಗೆ ನಂತರ ಹಸಿವಾಗಲು", "ವಿಶೇಷ ಲಾಭವಿಲ್ಲ"], "why": "ಬೇಗ ಶುರು ಮಾಡಿದರೆ ಪ್ರತಿಕಾಯಗಳಿರುವ ಗಿಣ್ಣುಹಾಲು ಸಿಗುತ್ತದೆ, ಹಾಲುಣಿಸುವಿಕೆ ಸ್ಥಿರವಾಗುತ್ತದೆ, ನವಜಾತ ಸಾವು ಕಡಿಮೆ. ಜೇನು, ಘುಟ್ಟಿ ಮುಂತಾದ ಮೊದಲ ಆಹಾರ ಕೊಡಬಾರದು.", "a": 1}}, {"id": "maternal-8", "topic": "maternal", "q": "Kangaroo Mother Care (continuous skin-to-skin contact plus exclusive breastfeeding) is mainly recommended for:", "o": ["All healthy term babies only", "Low-birth-weight and preterm babies", "Babies with jaundice only", "Mothers with fever"], "a": 1, "why": "KMC stabilises temperature, breathing and feeding in low-birth-weight (LBW) and preterm babies and is a proven, low-cost intervention.", "hi": {"q": "कंगारू मदर केयर (लगातार त्वचा-से-त्वचा संपर्क और केवल स्तनपान) मुख्य रूप से किसके लिए सुझाई जाती है?", "o": ["केवल सभी स्वस्थ पूर्ण-अवधि शिशु", "कम वज़न वाले और समय से पहले जन्मे शिशु", "केवल पीलिया वाले शिशु", "बुखार वाली माताएँ"], "a": 1, "why": "KMC कम वज़न (LBW) और समय से पहले जन्मे शिशुओं में तापमान, सांस और दूध पीना स्थिर करती है; यह सिद्ध और सस्ता उपाय है।"}, "kn": {"q": "ಕಾಂಗರೂ ತಾಯಿ ಆರೈಕೆ (ನಿರಂತರ ಚರ್ಮ-ಚರ್ಮ ಸಂಪರ್ಕ ಮತ್ತು ಕೇವಲ ಎದೆಹಾಲು) ಮುಖ್ಯವಾಗಿ ಯಾರಿಗೆ?", "o": ["ಆರೋಗ್ಯವಂತ ಪೂರ್ಣಾವಧಿ ಮಕ್ಕಳಿಗೆ ಮಾತ್ರ", "ಕಡಿಮೆ ತೂಕದ ಮತ್ತು ಅವಧಿಪೂರ್ವ ಮಕ್ಕಳಿಗೆ", "ಕಾಮಾಲೆ ಇರುವ ಮಕ್ಕಳಿಗೆ ಮಾತ್ರ", "ಜ್ವರ ಇರುವ ತಾಯಂದಿರಿಗೆ"], "why": "KMC ಕಡಿಮೆ ತೂಕದ (LBW) ಮತ್ತು ಅವಧಿಪೂರ್ವ ಮಕ್ಕಳಲ್ಲಿ ದೇಹದ ಉಷ್ಣತೆ, ಉಸಿರಾಟ ಮತ್ತು ಹಾಲುಣಿಸುವಿಕೆಯನ್ನು ಸ್ಥಿರಗೊಳಿಸುತ್ತದೆ; ಇದು ಸಾಬೀತಾದ, ಕಡಿಮೆ ಖರ್ಚಿನ ಕ್ರಮ.", "a": 1}}, {"id": "maternal-9", "topic": "maternal", "q": "At an ANC visit, a woman's haemoglobin is 6.8 g/dL. What should you do?", "o": ["Advise more green leafy vegetables only", "Record it and check again next month", "Refer her urgently for further management", "Nothing; this is normal in pregnancy"], "a": 2, "why": "Hb below 7 g/dL is severe anaemia in pregnancy, a risk factor for death during delivery. Severe anaemia needs urgent referral, not diet advice alone.", "hi": {"q": "ANC जांच में एक महिला का हीमोग्लोबिन 6.8 g/dL है। आप क्या करेंगी?", "o": ["केवल हरी पत्तेदार सब्ज़ियाँ खाने की सलाह", "दर्ज करें और अगले महीने फिर जांचें", "आगे इलाज के लिए तुरंत रेफर करें", "कुछ नहीं; गर्भावस्था में यह सामान्य है"], "a": 2, "why": "गर्भावस्था में 7 g/dL से कम Hb गंभीर एनीमिया है, जो प्रसव के समय मृत्यु का जोखिम बढ़ाता है। इसमें केवल आहार सलाह नहीं, तुरंत रेफर ज़रूरी है।"}, "kn": {"q": "ANC ಭೇಟಿಯಲ್ಲಿ ಮಹಿಳೆಯ ಹಿಮೋಗ್ಲೋಬಿನ್ 6.8 g/dL ಇದೆ. ನೀವು ಏನು ಮಾಡಬೇಕು?", "o": ["ಹಸಿರು ಸೊಪ್ಪು ಹೆಚ್ಚು ತಿನ್ನಲು ಮಾತ್ರ ಹೇಳಿ", "ದಾಖಲಿಸಿ ಮುಂದಿನ ತಿಂಗಳು ಮತ್ತೆ ನೋಡಿ", "ಮುಂದಿನ ಚಿಕಿತ್ಸೆಗೆ ತಕ್ಷಣ ರೆಫರ್ ಮಾಡಿ", "ಏನೂ ಬೇಡ; ಗರ್ಭದಲ್ಲಿ ಇದು ಸಾಮಾನ್ಯ"], "why": "ಗರ್ಭಾವಸ್ಥೆಯಲ್ಲಿ Hb 7 g/dL ಗಿಂತ ಕಡಿಮೆ ಎಂದರೆ ತೀವ್ರ ರಕ್ತಹೀನತೆ; ಹೆರಿಗೆ ವೇಳೆ ಸಾವಿನ ಅಪಾಯ. ಆಹಾರ ಸಲಹೆ ಮಾತ್ರ ಸಾಲದು, ತಕ್ಷಣ ರೆಫರ್ ಮಾಡಿ.", "a": 2}}, {"id": "maternal-10", "topic": "maternal", "q": "A woman 8 months pregnant tells you the baby's movements have become much less. This means:", "o": ["The baby is sleeping", "She should count again next week", "She needs an immediate check-up, reduced fetal movement is a danger sign", "It is normal in the last month"], "a": 2, "why": "Reduced fetal movement can signal fetal distress and must be checked the same day, not watched at home.", "hi": {"q": "8 महीने की गर्भवती महिला बताती है कि बच्चे का हिलना-डुलना बहुत कम हो गया है। इसका अर्थ:", "o": ["बच्चा सो रहा है", "अगले हफ्ते फिर गिनें", "तुरंत जांच ज़रूरी है; गर्भस्थ शिशु का कम हिलना खतरे का संकेत है", "आखिरी महीने में यह सामान्य है"], "a": 2, "why": "गर्भस्थ शिशु का कम हिलना शिशु के संकट का संकेत हो सकता है; उसी दिन जांच होनी चाहिए, घर पर इंतज़ार नहीं।"}, "kn": {"q": "8 ತಿಂಗಳ ಗರ್ಭಿಣಿ ಮಗುವಿನ ಚಲನೆ ತುಂಬಾ ಕಡಿಮೆಯಾಗಿದೆ ಎನ್ನುತ್ತಾರೆ. ಇದರ ಅರ್ಥ:", "o": ["ಮಗು ನಿದ್ದೆ ಮಾಡುತ್ತಿದೆ", "ಮುಂದಿನ ವಾರ ಮತ್ತೆ ಎಣಿಸಲಿ", "ತಕ್ಷಣ ತಪಾಸಣೆ ಬೇಕು; ಚಲನೆ ಕಡಿಮೆಯಾಗುವುದು ಅಪಾಯದ ಲಕ್ಷಣ", "ಕೊನೆಯ ತಿಂಗಳಲ್ಲಿ ಇದು ಸಾಮಾನ್ಯ"], "why": "ಮಗುವಿನ ಚಲನೆ ಕಡಿಮೆಯಾದರೆ ಭ್ರೂಣಕ್ಕೆ ತೊಂದರೆ ಇರಬಹುದು; ಮನೆಯಲ್ಲಿ ಕಾಯದೆ ಅದೇ ದಿನ ತಪಾಸಣೆ ಮಾಡಿಸಬೇಕು.", "a": 2}}, {"id": "immunization-1", "topic": "immunization", "q": "BCG vaccine is given by which route and at which site?", "o": ["Oral drops, on the tongue", "Intradermal injection, left upper arm", "Subcutaneous injection, right arm", "Intramuscular injection, thigh"], "a": 1, "why": "BCG is a single intradermal dose (0.1 mL in India's UIP) into the left upper arm at birth; a small raised wheal should be visible after correct technique.", "hi": {"q": "BCG का टीका किस तरीके से और कहाँ लगाया जाता है?", "o": ["मुँह से बूँदें, जीभ पर", "त्वचा के अंदर (इंट्राडर्मल) इंजेक्शन, बाईं ऊपरी बाँह", "त्वचा के नीचे (सबक्यूटेनियस) इंजेक्शन, दाईं बाँह", "मांसपेशी में (इंट्रामस्कुलर) इंजेक्शन, जांघ"], "a": 1, "why": "BCG जन्म पर बाईं ऊपरी बाँह में एक इंट्राडर्मल खुराक (भारत के UIP में 0.1 mL) है; सही तरीके से लगाने पर छोटा उभार दिखना चाहिए।"}, "kn": {"q": "BCG ಲಸಿಕೆ ಯಾವ ವಿಧಾನದಲ್ಲಿ, ಎಲ್ಲಿ ಕೊಡಲಾಗುತ್ತದೆ?", "o": ["ಬಾಯಿ ಹನಿ, ನಾಲಿಗೆ ಮೇಲೆ", "ಚರ್ಮದೊಳಗೆ (ಇಂಟ್ರಾಡರ್ಮಲ್) ಚುಚ್ಚುಮದ್ದು, ಎಡ ಮೇಲ್ತೋಳು", "ಚರ್ಮದಡಿ ಚುಚ್ಚುಮದ್ದು, ಬಲ ತೋಳು", "ಸ್ನಾಯುವಿಗೆ ಚುಚ್ಚುಮದ್ದು, ತೊಡೆ"], "why": "BCG ಹುಟ್ಟಿದಾಗ ಎಡ ಮೇಲ್ತೋಳಿಗೆ ಒಂದೇ ಇಂಟ್ರಾಡರ್ಮಲ್ ಡೋಸ್ (UIP ಯಲ್ಲಿ 0.1 mL); ಸರಿಯಾದ ವಿಧಾನದಲ್ಲಿ ಸಣ್ಣ ಉಬ್ಬು ಕಾಣಬೇಕು.", "a": 1}}, {"id": "immunization-2", "topic": "immunization", "q": "The Hepatitis B birth dose should be given to every newborn within:", "o": ["1 week of birth", "72 hours of birth", "24 hours of birth", "At 6 weeks only"], "a": 2, "why": "India's UIP gives the Hepatitis B birth dose within 24 hours of birth to prevent mother-to-child transmission.", "hi": {"q": "हेपेटाइटिस B की जन्म खुराक हर नवजात को कितने समय के भीतर दी जानी चाहिए?", "o": ["जन्म के 1 हफ्ते के भीतर", "जन्म के 72 घंटे के भीतर", "जन्म के 24 घंटे के भीतर", "केवल 6 हफ्ते पर"], "a": 2, "why": "माँ से बच्चे में संक्रमण रोकने के लिए भारत का UIP हेपेटाइटिस B की जन्म खुराक 24 घंटे के भीतर देता है।"}, "kn": {"q": "ಹೆಪಟೈಟಿಸ್ B ಹುಟ್ಟು ಡೋಸ್ ಪ್ರತಿ ನವಜಾತ ಶಿಶುವಿಗೆ ಯಾವುದರೊಳಗೆ ಕೊಡಬೇಕು?", "o": ["ಹುಟ್ಟಿದ 1 ವಾರದೊಳಗೆ", "ಹುಟ್ಟಿದ 72 ಗಂಟೆಯೊಳಗೆ", "ಹುಟ್ಟಿದ 24 ಗಂಟೆಯೊಳಗೆ", "6 ವಾರದಲ್ಲಿ ಮಾತ್ರ"], "why": "ತಾಯಿಯಿಂದ ಮಗುವಿಗೆ ಹರಡುವುದನ್ನು ತಡೆಯಲು UIP ಹೆಪಟೈಟಿಸ್ B ಹುಟ್ಟು ಡೋಸ್ ಅನ್ನು ಹುಟ್ಟಿದ 24 ಗಂಟೆಯೊಳಗೆ ಕೊಡುತ್ತದೆ.", "a": 2}}, {"id": "immunization-3", "topic": "immunization", "q": "Which vaccines does a 6-week-old baby receive in one session under UIP?", "o": ["Only BCG", "OPV-1, Pentavalent-1, Rota-1, fIPV-1 and PCV-1", "Only MR and JE", "Measles and Hepatitis B"], "a": 1, "why": "At 6 weeks the baby gets OPV-1, pentavalent-1 (DPT+HepB+Hib), rotavirus-1, fractional IPV-1 and PCV-1, along with a weight check.", "hi": {"q": "UIP के तहत 6 हफ्ते के शिशु को एक ही सत्र में कौन-से टीके मिलते हैं?", "o": ["केवल BCG", "OPV-1, पेंटावैलेंट-1, रोटा-1, fIPV-1 और PCV-1", "केवल MR और JE", "खसरा और हेपेटाइटिस B"], "a": 1, "why": "6 हफ्ते पर शिशु को OPV-1, पेंटावैलेंट-1 (DPT+HepB+Hib), रोटावायरस-1, fIPV-1 और PCV-1 मिलते हैं, साथ में वज़न जांच।"}, "kn": {"q": "UIP ಅಡಿ 6 ವಾರದ ಮಗುವಿಗೆ ಒಂದೇ ಸೆಷನ್‌ನಲ್ಲಿ ಯಾವ ಲಸಿಕೆಗಳು?", "o": ["BCG ಮಾತ್ರ", "OPV-1, ಪೆಂಟಾವ್ಯಾಲೆಂಟ್-1, ರೋಟಾ-1, fIPV-1 ಮತ್ತು PCV-1", "MR ಮತ್ತು JE ಮಾತ್ರ", "ದಡಾರ ಮತ್ತು ಹೆಪಟೈಟಿಸ್ B"], "why": "6 ವಾರದಲ್ಲಿ OPV-1, ಪೆಂಟಾವ್ಯಾಲೆಂಟ್-1 (DPT+HepB+Hib), ರೋಟಾವೈರಸ್-1, ಫ್ರ್ಯಾಕ್ಷನಲ್ IPV-1 ಮತ್ತು PCV-1, ಜೊತೆಗೆ ತೂಕ ಪರೀಕ್ಷೆ.", "a": 1}}, {"id": "immunization-4", "topic": "immunization", "q": "The FIRST dose of Vitamin A solution is given at:", "o": ["Birth", "6 weeks", "9 months along with MR-1", "5 years"], "a": 2, "why": "Vitamin A 1st dose (1 lakh IU) is given at 9 completed months with the MR-1 dose; the 2nd dose (2 lakh IU) at 16-24 months.", "hi": {"q": "विटामिन A घोल की पहली खुराक कब दी जाती है?", "o": ["जन्म पर", "6 हफ्ते पर", "9 महीने पर MR-1 के साथ", "5 साल पर"], "a": 2, "why": "विटामिन A की पहली खुराक (1 लाख IU) 9 पूरे महीने पर MR-1 के साथ दी जाती है; दूसरी खुराक (2 लाख IU) 16-24 महीने पर।"}, "kn": {"q": "ವಿಟಮಿನ್ A ದ್ರಾವಣದ ಮೊದಲ ಡೋಸ್ ಯಾವಾಗ?", "o": ["ಹುಟ್ಟಿದಾಗ", "6 ವಾರದಲ್ಲಿ", "9 ತಿಂಗಳಲ್ಲಿ MR-1 ಜೊತೆ", "5 ವರ್ಷದಲ್ಲಿ"], "why": "ವಿಟಮಿನ್ A ಮೊದಲ ಡೋಸ್ (1 ಲಕ್ಷ IU) 9 ತಿಂಗಳು ಪೂರ್ಣವಾದಾಗ MR-1 ಜೊತೆ; ಎರಡನೇ ಡೋಸ್ (2 ಲಕ್ಷ IU) 16-24 ತಿಂಗಳಲ್ಲಿ.", "a": 2}}, {"id": "immunization-5", "topic": "immunization", "q": "MR-2 (Measles-Rubella second dose) and DPT booster-1 are given at:", "o": ["9 months", "12 months", "16-24 months", "5 years"], "a": 2, "why": "At 16-24 months: MR-2, DPT booster-1, OPV booster, JE-2 in endemic districts and Vitamin A 2nd dose.", "hi": {"q": "MR-2 (खसरा-रूबेला दूसरी खुराक) और DPT बूस्टर-1 कब दिए जाते हैं?", "o": ["9 महीने", "12 महीने", "16-24 महीने", "5 साल"], "a": 2, "why": "16-24 महीने पर: MR-2, DPT बूस्टर-1, OPV बूस्टर, प्रभावित ज़िलों में JE-2 और विटामिन A की दूसरी खुराक।"}, "kn": {"q": "MR-2 (ದಡಾರ-ರುಬೆಲ್ಲಾ ಎರಡನೇ ಡೋಸ್) ಮತ್ತು DPT ಬೂಸ್ಟರ್-1 ಯಾವಾಗ?", "o": ["9 ತಿಂಗಳು", "12 ತಿಂಗಳು", "16-24 ತಿಂಗಳು", "5 ವರ್ಷ"], "why": "16-24 ತಿಂಗಳಲ್ಲಿ: MR-2, DPT ಬೂಸ್ಟರ್-1, OPV ಬೂಸ್ಟರ್, ಸ್ಥಳೀಯ ಜಿಲ್ಲೆಗಳಲ್ಲಿ JE-2 ಮತ್ತು ವಿಟಮಿನ್ A ಎರಡನೇ ಡೋಸ್.", "a": 2}}, {"id": "immunization-6", "topic": "immunization", "q": "After reconstitution, opened BCG vial must be discarded after:", "o": ["30 minutes", "4 hours", "24 hours", "The end of the session day"], "a": 1, "why": "Reconstituted BCG loses potency and risks contamination; it must be discarded within 4 hours of reconstitution (and at end of session, whichever is earlier).", "hi": {"q": "घोलने के बाद खुली BCG शीशी को कितने समय बाद फेंक देना चाहिए?", "o": ["30 मिनट", "4 घंटे", "24 घंटे", "सत्र के दिन के अंत में"], "a": 1, "why": "घोली हुई BCG की ताकत घटती है और संक्रमण का खतरा रहता है; इसे घोलने के 4 घंटे के भीतर (या सत्र खत्म होने पर, जो पहले हो) फेंकना ज़रूरी है।"}, "kn": {"q": "ಕರಗಿಸಿದ (ರಿಕಾನ್ಸ್ಟಿಟ್ಯೂಟ್) BCG ವಯಲ್ ಅನ್ನು ಎಷ್ಟು ಸಮಯದ ನಂತರ ಎಸೆಯಬೇಕು?", "o": ["30 ನಿಮಿಷ", "4 ಗಂಟೆ", "24 ಗಂಟೆ", "ಸೆಷನ್ ದಿನದ ಕೊನೆಗೆ"], "why": "ಕರಗಿಸಿದ BCG ಶಕ್ತಿ ಕಳೆದುಕೊಳ್ಳುತ್ತದೆ, ಸೋಂಕಿನ ಅಪಾಯವೂ ಇದೆ; 4 ಗಂಟೆಯೊಳಗೆ (ಅಥವಾ ಸೆಷನ್ ಕೊನೆಗೆ, ಯಾವುದು ಮೊದಲೋ) ಎಸೆಯಬೇಕು.", "a": 1}}, {"id": "immunization-7", "topic": "immunization", "q": "The 'shake test' performed on a vial of DPT/HepB/Td is used to detect:", "o": ["Expired vaccine", "Freeze-damaged vaccine", "Overheated vaccine", "A broken seal"], "a": 1, "why": "Adsorbed vaccines frozen by mistake settle as a sediment that does not disperse on shaking. Frozen adsorbed vaccines must never be used.", "hi": {"q": "DPT/HepB/Td की शीशी पर किया जाने वाला 'शेक टेस्ट' किसका पता लगाता है?", "o": ["एक्सपायर टीका", "जमने से खराब हुआ टीका", "ज़्यादा गर्म हुआ टीका", "टूटी सील"], "a": 1, "why": "गलती से जम गए एडसॉर्ब्ड टीके हिलाने पर भी न घुलने वाली तलछट बना लेते हैं। जमे हुए एडसॉर्ब्ड टीके कभी इस्तेमाल न करें।"}, "kn": {"q": "DPT/HepB/Td ವಯಲ್ ಮೇಲೆ ಮಾಡುವ 'ಶೇಕ್ ಟೆಸ್ಟ್' ಏನನ್ನು ಪತ್ತೆ ಮಾಡುತ್ತದೆ?", "o": ["ಅವಧಿ ಮೀರಿದ ಲಸಿಕೆ", "ಹೆಪ್ಪುಗಟ್ಟಿ ಹಾಳಾದ ಲಸಿಕೆ", "ಅತಿ ಬಿಸಿಯಾದ ಲಸಿಕೆ", "ಮುರಿದ ಸೀಲ್"], "why": "ತಪ್ಪಿ ಹೆಪ್ಪುಗಟ್ಟಿದ ಅಡ್ಸಾರ್ಬ್ಡ್ ಲಸಿಕೆಗಳಲ್ಲಿ ಅಲುಗಾಡಿಸಿದರೂ ಕರಗದ ತಳಕಸ ಉಳಿಯುತ್ತದೆ. ಹೆಪ್ಪುಗಟ್ಟಿದ ಲಸಿಕೆ ಎಂದೂ ಬಳಸಬಾರದು.", "a": 1}}, {"id": "immunization-8", "topic": "immunization", "q": "OPV and Rotavirus vaccines are administered by which route?", "o": ["Intramuscular", "Intradermal", "Oral", "Subcutaneous"], "a": 2, "why": "Both OPV and rotavirus vaccine are oral vaccines. Correct technique (dropping onto the tongue, no re-feeding immediately) matters for potency and take.", "hi": {"q": "OPV और रोटावायरस टीके किस तरीके से दिए जाते हैं?", "o": ["मांसपेशी में (इंट्रामस्कुलर)", "त्वचा के अंदर (इंट्राडर्मल)", "मुँह से (ओरल)", "त्वचा के नीचे (सबक्यूटेनियस)"], "a": 2, "why": "OPV और रोटावायरस दोनों मुँह से दिए जाने वाले टीके हैं। सही तरीका (बूँदें जीभ पर डालना) असर के लिए ज़रूरी है।"}, "kn": {"q": "OPV ಮತ್ತು ರೋಟಾವೈರಸ್ ಲಸಿಕೆಗಳನ್ನು ಯಾವ ವಿಧಾನದಲ್ಲಿ ಕೊಡಲಾಗುತ್ತದೆ?", "o": ["ಸ್ನಾಯುವಿಗೆ", "ಚರ್ಮದೊಳಗೆ", "ಬಾಯಿ ಮೂಲಕ", "ಚರ್ಮದಡಿ"], "why": "OPV ಮತ್ತು ರೋಟಾವೈರಸ್ ಎರಡೂ ಬಾಯಿಯ ಲಸಿಕೆಗಳು. ನಾಲಿಗೆ ಮೇಲೆ ಹನಿ ಹಾಕುವುದು, ತಕ್ಷಣ ಮತ್ತೆ ಉಣಿಸದಿರುವುದು ಮುಖ್ಯ.", "a": 2}}, {"id": "immunization-9", "topic": "immunization", "q": "Among routine UIP vaccines, which is the MOST sensitive to heat?", "o": ["BCG", "OPV (oral polio vaccine)", "Td (tetanus-diphtheria)", "Hepatitis B"], "a": 1, "why": "Live liquid OPV is the most heat-sensitive vaccine in the UIP cold chain, which is why vial monitors and ice-packs discipline matter so much.", "hi": {"q": "UIP के नियमित टीकों में गर्मी के प्रति सबसे संवेदनशील कौन-सा है?", "o": ["BCG", "OPV (मुँह से पोलियो टीका)", "Td (टिटनेस-डिप्थीरिया)", "हेपेटाइटिस B"], "a": 1, "why": "जीवित तरल OPV, UIP कोल्ड चेन में सबसे ज़्यादा गर्मी-संवेदनशील टीका है; इसलिए वायल मॉनिटर और आइस-पैक का अनुशासन इतना ज़रूरी है।"}, "kn": {"q": "UIP ಲಸಿಕೆಗಳಲ್ಲಿ ಶಾಖಕ್ಕೆ ಅತಿ ಸೂಕ್ಷ್ಮವಾದದ್ದು ಯಾವುದು?", "o": ["BCG", "OPV (ಬಾಯಿ ಪೋಲಿಯೊ ಲಸಿಕೆ)", "Td (ಟೆಟನಸ್-ಡಿಫ್ತೀರಿಯಾ)", "ಹೆಪಟೈಟಿಸ್ B"], "why": "ಜೀವಂತ ದ್ರವ OPV ಕೋಲ್ಡ್ ಚೈನ್‌ನಲ್ಲಿ ಶಾಖಕ್ಕೆ ಅತಿ ಸೂಕ್ಷ್ಮ ಲಸಿಕೆ; ಆದ್ದರಿಂದ ವಯಲ್ ಮಾನಿಟರ್ ಮತ್ತು ಐಸ್-ಪ್ಯಾಕ್ ಶಿಸ್ತು ಬಹಳ ಮುಖ್ಯ.", "a": 1}}, {"id": "immunization-10", "topic": "immunization", "q": "MR-1 (Measles-Rubella first dose) is given at:", "o": ["6 completed weeks", "6 completed months", "9-12 completed months", "2 years"], "a": 2, "why": "MR-1 is given at 9-12 completed months, subcutaneously in the right upper arm.", "hi": {"q": "MR-1 (खसरा-रूबेला पहली खुराक) कब दी जाती है?", "o": ["6 पूरे हफ्ते", "6 पूरे महीने", "9-12 पूरे महीने", "2 साल"], "a": 2, "why": "MR-1, 9-12 पूरे महीने पर दाईं ऊपरी बाँह में त्वचा के नीचे (सबक्यूटेनियस) दी जाती है।"}, "kn": {"q": "MR-1 (ದಡಾರ-ರುಬೆಲ್ಲಾ ಮೊದಲ ಡೋಸ್) ಯಾವಾಗ?", "o": ["6 ವಾರ ಪೂರ್ಣ", "6 ತಿಂಗಳು ಪೂರ್ಣ", "9-12 ತಿಂಗಳು ಪೂರ್ಣ", "2 ವರ್ಷ"], "why": "MR-1 ಅನ್ನು 9-12 ತಿಂಗಳು ಪೂರ್ಣವಾದಾಗ ಬಲ ಮೇಲ್ತೋಳಿಗೆ ಚರ್ಮದಡಿ ಕೊಡಲಾಗುತ್ತದೆ.", "a": 2}}, {"id": "nutrition-1", "topic": "nutrition", "q": "Exclusive breastfeeding means the baby receives ONLY breast milk (no water, no other food) for the first:", "o": ["1 month", "3 months", "6 months", "12 months"], "a": 2, "why": "WHO and MoHFW recommend exclusive breastfeeding for the first 6 months, with timely complementary feeding started at 6 months.", "hi": {"q": "विशेष रूप से माँ का दूध (पानी सहित कुछ भी नहीं) जन्म के बाद पहले कितने महीने?", "o": ["1 महीना", "3 महीने", "6 महीने", "12 महीने"], "a": 2, "why": "WHO और MoHFW पहले 6 महीने केवल माँ का दूध (exclusive breastfeeding) की सलाह देते हैं; 6 महीने पर ठोस आहार शुरू करें।"}, "kn": {"q": "ಕೇವಲ ಎದೆಹಾಲು ಎಂದರೆ ಮಗುವಿಗೆ ಎದೆಹಾಲು ಮಾತ್ರ (ನೀರು, ಬೇರೆ ಆಹಾರ ಇಲ್ಲ) ಮೊದಲ ಎಷ್ಟು ಅವಧಿ?", "o": ["1 ತಿಂಗಳು", "3 ತಿಂಗಳು", "6 ತಿಂಗಳು", "12 ತಿಂಗಳು"], "why": "WHO ಮತ್ತು MoHFW ಮೊದಲ 6 ತಿಂಗಳು ಕೇವಲ ಎದೆಹಾಲು, 6 ತಿಂಗಳಿಂದ ಸಮಯಕ್ಕೆ ಪೂರಕ ಆಹಾರ ಶಿಫಾರಸು ಮಾಡುತ್ತವೆ.", "a": 2}}, {"id": "nutrition-2", "topic": "nutrition", "q": "Complementary (semisolid) foods should begin at 6 months, and breastfeeding should continue:", "o": ["Until 1 year", "Up to 2 years or beyond", "Only until 9 months", "Only while the mother works at home"], "a": 1, "why": "At 6 months start thick complementary feeds 2-3 times a day and continue breastfeeding up to 2 years or beyond.", "hi": {"q": "6 महीने पर अर्ध-ठोस (पूरक) आहार शुरू होना चाहिए, और स्तनपान कब तक जारी रहना चाहिए?", "o": ["1 साल तक", "2 साल या उससे आगे तक", "केवल 9 महीने तक", "केवल जब तक माँ घर पर काम करे"], "a": 1, "why": "6 महीने पर दिन में 2-3 बार गाढ़ा पूरक आहार शुरू करें और स्तनपान 2 साल या उससे आगे तक जारी रखें।"}, "kn": {"q": "6 ತಿಂಗಳಿಂದ ಪೂರಕ (ಅರೆಘನ) ಆಹಾರ ಶುರು; ಎದೆಹಾಲು ಎಲ್ಲಿಯವರೆಗೆ ಮುಂದುವರಿಸಬೇಕು?", "o": ["1 ವರ್ಷದವರೆಗೆ", "2 ವರ್ಷ ಅಥವಾ ಹೆಚ್ಚು", "9 ತಿಂಗಳವರೆಗೆ ಮಾತ್ರ", "ತಾಯಿ ಮನೆಯಲ್ಲಿ ಇರುವಾಗ ಮಾತ್ರ"], "why": "6 ತಿಂಗಳಲ್ಲಿ ದಿನಕ್ಕೆ 2-3 ಬಾರಿ ಗಟ್ಟಿಯಾದ ಪೂರಕ ಆಹಾರ ಶುರು ಮಾಡಿ, ಎದೆಹಾಲು 2 ವರ್ಷ ಅಥವಾ ಹೆಚ್ಚು ಮುಂದುವರಿಸಿ.", "a": 1}}, {"id": "nutrition-3", "topic": "nutrition", "q": "For a 2-year-old with acute watery diarrhoea and NO danger signs, the standard zinc regimen is:", "o": ["5 mg once", "20 mg daily for 14 days", "20 mg once a week for a month", "Zinc is not useful in diarrhoea"], "a": 1, "why": "Zinc 20 mg/day for 14 days (10 mg/day for infants under 6 months) reduces duration and severity of the episode and protects for the next 2-3 months.", "hi": {"q": "2 साल के बच्चे के पतले दस्त (बिना खतरे के संकेत) में जिंक की खुराक:", "o": ["एक बार 5 मिग्रा", "14 दिन तक प्रतिदिन 20 मिग्रा", "हफ्ते में एक बार एक महीना", "जिंक दस्त में उपयोगी नहीं"], "a": 1, "why": "दस्त में जिंक 20 मिग्रा/दिन, 14 दिन (6 महीने से छोटे शिशु में 10 मिग्रा) से दस्त कम होते हैं और अगले 2-3 महीने बचाव मिलता है।"}, "kn": {"q": "ಅಪಾಯದ ಲಕ್ಷಣಗಳಿಲ್ಲದ, ತೀವ್ರ ನೀರಿನ ಭೇದಿ ಇರುವ 2 ವರ್ಷದ ಮಗುವಿಗೆ ಸಾಮಾನ್ಯ ಜಿಂಕ್ ಕ್ರಮ:", "o": ["5 mg ಒಮ್ಮೆ", "14 ದಿನ ದಿನಕ್ಕೆ 20 mg", "ಒಂದು ತಿಂಗಳು ವಾರಕ್ಕೊಮ್ಮೆ 20 mg", "ಭೇದಿಯಲ್ಲಿ ಜಿಂಕ್ ಉಪಯೋಗವಿಲ್ಲ"], "why": "14 ದಿನ ದಿನಕ್ಕೆ 20 mg ಜಿಂಕ್ (6 ತಿಂಗಳೊಳಗಿನ ಶಿಶುಗಳಿಗೆ 10 mg) ಭೇದಿಯ ಅವಧಿ ಮತ್ತು ತೀವ್ರತೆ ಕಡಿಮೆ ಮಾಡುತ್ತದೆ, ಮುಂದಿನ 2-3 ತಿಂಗಳು ರಕ್ಷಣೆ ಕೊಡುತ್ತದೆ.", "a": 1}}, {"id": "nutrition-4", "topic": "nutrition", "q": "During an episode of diarrhoea, feeding should be:", "o": ["Stopped until stools stop", "Reduced to liquids only", "Continued, with extra fluid and one extra meal after recovery", "Increased only if the child asks"], "a": 2, "why": "Continue feeding and breastfeeding through the illness ('continue feeding' is a core ORS corner rule) and give one extra meal daily for 2 weeks after recovery.", "hi": {"q": "दस्त के दौरान बच्चे को खिलाना:", "o": ["दस्त रुकने तक बंद", "केवल तरल तक सीमित", "जारी रखें, ज़्यादा तरल दें और ठीक होने के बाद एक अतिरिक्त भोजन दें", "केवल तब बढ़ाएँ जब बच्चा माँगे"], "a": 2, "why": "बीमारी के दौरान खिलाना और स्तनपान जारी रखें ('खिलाना जारी रखें' ORS कॉर्नर का मुख्य नियम है), और ठीक होने के बाद 2 हफ्ते रोज़ एक अतिरिक्त भोजन दें।"}, "kn": {"q": "ಭೇದಿ ಇರುವಾಗ ಆಹಾರ ಹೇಗಿರಬೇಕು?", "o": ["ಭೇದಿ ನಿಲ್ಲುವವರೆಗೆ ನಿಲ್ಲಿಸಿ", "ದ್ರವ ಮಾತ್ರ", "ಮುಂದುವರಿಸಿ, ಹೆಚ್ಚು ದ್ರವ ಕೊಡಿ, ಗುಣವಾದ ನಂತರ ಒಂದು ಹೆಚ್ಚುವರಿ ಊಟ", "ಮಗು ಕೇಳಿದರೆ ಮಾತ್ರ ಹೆಚ್ಚಿಸಿ"], "why": "ಕಾಯಿಲೆಯ ಸಮಯದಲ್ಲೂ ಆಹಾರ ಮತ್ತು ಎದೆಹಾಲು ಮುಂದುವರಿಸಿ (ORS ಕಾರ್ನರ್‌ನ ಮುಖ್ಯ ನಿಯಮ); ಗುಣವಾದ ನಂತರ 2 ವಾರ ದಿನಕ್ಕೆ ಒಂದು ಹೆಚ್ಚುವರಿ ಊಟ ಕೊಡಿ.", "a": 2}}, {"id": "nutrition-5", "topic": "nutrition", "q": "A child's mid-upper-arm circumference (MUAC) measures 11.2 cm. This indicates:", "o": ["Normal nutrition", "Moderate acute malnutrition", "Severe acute malnutrition, needing referral to an NRC/OTC", "Nothing; MUAC is for adults"], "a": 2, "why": "MUAC below 11.5 cm flags severe acute malnutrition (red zone). Such children need urgent referral to a Nutrition Rehabilitation Centre or an outpatient therapeutic programme.", "hi": {"q": "एक बच्चे की बाँह के बीच की परिधि (MUAC) 11.2 cm है। इसका अर्थ है:", "o": ["सामान्य पोषण", "मध्यम तीव्र कुपोषण", "गंभीर तीव्र कुपोषण, NRC/OTC रेफर करना ज़रूरी", "कुछ नहीं; MUAC वयस्कों के लिए है"], "a": 2, "why": "11.5 cm से कम MUAC गंभीर तीव्र कुपोषण (लाल ज़ोन) है। ऐसे बच्चों को तुरंत पोषण पुनर्वास केंद्र (NRC) या बाह्य-रोगी उपचार कार्यक्रम में रेफर करें।"}, "kn": {"q": "ಮಗುವಿನ ಮೇಲ್ತೋಳಿನ ಸುತ್ತಳತೆ (MUAC) 11.2 cm ಇದೆ. ಇದರ ಅರ್ಥ:", "o": ["ಸಾಮಾನ್ಯ ಪೋಷಣೆ", "ಮಧ್ಯಮ ತೀವ್ರ ಅಪೌಷ್ಟಿಕತೆ", "ತೀವ್ರ ಅಪೌಷ್ಟಿಕತೆ; NRC/OTC ಗೆ ರೆಫರ್ ಮಾಡಬೇಕು", "ಏನೂ ಇಲ್ಲ; MUAC ದೊಡ್ಡವರಿಗೆ"], "why": "MUAC 11.5 cm ಗಿಂತ ಕಡಿಮೆ ಎಂದರೆ ತೀವ್ರ ತೀಕ್ಷ್ಣ ಅಪೌಷ್ಟಿಕತೆ (ಕೆಂಪು ವಲಯ). ಇಂತಹ ಮಕ್ಕಳನ್ನು ಪೋಷಣ ಪುನರ್ವಸತಿ ಕೇಂದ್ರ ಅಥವಾ ಹೊರರೋಗಿ ಚಿಕಿತ್ಸಾ ಕಾರ್ಯಕ್ರಮಕ್ಕೆ ತಕ್ಷಣ ರೆಫರ್ ಮಾಡಿ.", "a": 2}}, {"id": "nutrition-6", "topic": "nutrition", "q": "A mother asks how she can get more iron from her mostly plant-based diet. Best advice?", "o": ["Drink tea with every meal", "Pair iron-rich foods with vitamin C sources like amla, guava or lemon; avoid tea/coffee with meals", "Avoid all green vegetables", "Boil vegetables for hours"], "a": 1, "why": "Vitamin C strongly improves non-haem iron absorption, while tea and coffee inhibit it. Simple pairing advice is one of the highest-impact anaemia counselling points.", "hi": {"q": "एक माँ पूछती है कि अपने ज़्यादातर शाकाहारी भोजन से ज़्यादा आयरन कैसे पाए। सबसे अच्छी सलाह?", "o": ["हर भोजन के साथ चाय पिएँ", "आयरन वाले भोजन के साथ विटामिन C (आँवला, अमरूद, नींबू) लें; भोजन के साथ चाय/कॉफी न लें", "सभी हरी सब्ज़ियाँ छोड़ दें", "सब्ज़ियों को घंटों उबालें"], "a": 1, "why": "विटामिन C पौधों वाले आयरन का अवशोषण बहुत बढ़ाता है, जबकि चाय और कॉफी उसे रोकते हैं। यह सरल जोड़ी एनीमिया परामर्श की सबसे असरदार सलाहों में से है।"}, "kn": {"q": "ಹೆಚ್ಚಾಗಿ ಸಸ್ಯಾಹಾರ ತಿನ್ನುವ ತಾಯಿ ಹೆಚ್ಚು ಕಬ್ಬಿಣ ಹೇಗೆ ಪಡೆಯಬಹುದು ಎಂದು ಕೇಳುತ್ತಾರೆ. ಉತ್ತಮ ಸಲಹೆ?", "o": ["ಪ್ರತಿ ಊಟದ ಜೊತೆ ಚಹಾ", "ಕಬ್ಬಿಣವಿರುವ ಆಹಾರದ ಜೊತೆ ನೆಲ್ಲಿಕಾಯಿ, ಸೀಬೆ, ನಿಂಬೆಯಂತಹ ವಿಟಮಿನ್ C; ಊಟದ ಜೊತೆ ಚಹಾ/ಕಾಫಿ ಬೇಡ", "ಎಲ್ಲಾ ಹಸಿರು ತರಕಾರಿ ಬಿಡಿ", "ತರಕಾರಿಯನ್ನು ಗಂಟೆಗಟ್ಟಲೆ ಕುದಿಸಿ"], "why": "ವಿಟಮಿನ್ C ಸಸ್ಯ ಕಬ್ಬಿಣದ ಹೀರಿಕೆಯನ್ನು ಬಹಳ ಹೆಚ್ಚಿಸುತ್ತದೆ; ಚಹಾ, ಕಾಫಿ ತಡೆಯುತ್ತವೆ. ರಕ್ತಹೀನತೆ ಸಲಹೆಯಲ್ಲಿ ಇದು ಅತಿ ಪರಿಣಾಮಕಾರಿ ಅಂಶ.", "a": 1}}, {"id": "nutrition-7", "topic": "nutrition", "q": "On a growth chart, a child's weight curve has been FLAT (no gain) for two consecutive months. The ASHA should:", "o": ["Nothing; flat lines are normal", "Assess feeding and illness, counsel the mother, and refer if the child is wasted", "Start a high-dose vitamin course herself", "Tell the family to feed more honey"], "a": 1, "why": "A flat or falling growth curve signals a problem: check feeding practices and illness, counsel, and refer any child with wasting or danger signs.", "hi": {"q": "ग्रोथ चार्ट पर बच्चे का वज़न लगातार दो महीने से सपाट (कोई बढ़त नहीं) है। आशा को क्या करना चाहिए?", "o": ["कुछ नहीं; सपाट रेखा सामान्य है", "खान-पान और बीमारी की जांच करें, माँ को परामर्श दें, और बच्चा दुबला (वेस्टेड) हो तो रेफर करें", "खुद ही विटामिन की ऊँची खुराक शुरू करें", "परिवार से ज़्यादा शहद खिलाने को कहें"], "a": 1, "why": "सपाट या गिरती ग्रोथ रेखा समस्या का संकेत है: खान-पान और बीमारी जांचें, परामर्श दें, और दुबलेपन या खतरे के संकेत वाले बच्चे को रेफर करें।"}, "kn": {"q": "ಬೆಳವಣಿಗೆ ಚಾರ್ಟ್‌ನಲ್ಲಿ ಮಗುವಿನ ತೂಕ ಸತತ ಎರಡು ತಿಂಗಳು ಸಮತಟ್ಟಾಗಿದೆ (ಏರಿಕೆ ಇಲ್ಲ). ಆಶಾ ಏನು ಮಾಡಬೇಕು?", "o": ["ಏನೂ ಬೇಡ; ಸಮತಟ್ಟು ಸಾಮಾನ್ಯ", "ಆಹಾರ ಮತ್ತು ಕಾಯಿಲೆ ಪರಿಶೀಲಿಸಿ, ತಾಯಿಗೆ ಸಲಹೆ ಕೊಡಿ, ಮಗು ಸೊರಗಿದ್ದರೆ ರೆಫರ್ ಮಾಡಿ", "ತಾವೇ ಹೆಚ್ಚು ಡೋಸ್ ವಿಟಮಿನ್ ಶುರು ಮಾಡಿ", "ಹೆಚ್ಚು ಜೇನು ಕೊಡಲು ಹೇಳಿ"], "why": "ಸಮತಟ್ಟಾದ ಅಥವಾ ಇಳಿಯುವ ಬೆಳವಣಿಗೆ ರೇಖೆ ಸಮಸ್ಯೆಯ ಸೂಚನೆ: ಆಹಾರ ಪದ್ಧತಿ ಮತ್ತು ಕಾಯಿಲೆ ಪರಿಶೀಲಿಸಿ, ಸಲಹೆ ಕೊಡಿ, ಸೊರಗುವಿಕೆ ಅಥವಾ ಅಪಾಯದ ಲಕ್ಷಣ ಇದ್ದರೆ ರೆಫರ್ ಮಾಡಿ.", "a": 1}}, {"id": "nutrition-8", "topic": "nutrition", "q": "Deworming (single dose albendazole 400 mg) in pregnancy is safe:", "o": ["In the first trimester", "After the first trimester", "Never in pregnancy", "Only during the last week"], "a": 1, "why": "National guidelines permit deworming after the first trimester as part of anaemia control; it is withheld in early pregnancy.", "hi": {"q": "गर्भावस्था में कृमिनाशक (एल्बेंडाज़ोल 400 mg की एक खुराक) कब सुरक्षित है?", "o": ["पहली तिमाही में", "पहली तिमाही के बाद", "गर्भावस्था में कभी नहीं", "केवल आखिरी हफ्ते में"], "a": 1, "why": "एनीमिया नियंत्रण के तहत राष्ट्रीय दिशानिर्देश पहली तिमाही के बाद कृमिनाशक की अनुमति देते हैं; शुरुआती गर्भावस्था में यह नहीं दिया जाता।"}, "kn": {"q": "ಗರ್ಭಾವಸ್ಥೆಯಲ್ಲಿ ಜಂತುಹುಳು ನಿವಾರಣೆ (ಆಲ್ಬೆಂಡಜೋಲ್ 400 mg ಒಂದು ಡೋಸ್) ಯಾವಾಗ ಸುರಕ್ಷಿತ?", "o": ["ಮೊದಲ ತ್ರೈಮಾಸಿಕದಲ್ಲಿ", "ಮೊದಲ ತ್ರೈಮಾಸಿಕದ ನಂತರ", "ಗರ್ಭಾವಸ್ಥೆಯಲ್ಲಿ ಎಂದೂ ಇಲ್ಲ", "ಕೊನೆಯ ವಾರದಲ್ಲಿ ಮಾತ್ರ"], "why": "ರಕ್ತಹೀನತೆ ನಿಯಂತ್ರಣದ ಭಾಗವಾಗಿ ರಾಷ್ಟ್ರೀಯ ಮಾರ್ಗಸೂಚಿ ಮೊದಲ ತ್ರೈಮಾಸಿಕದ ನಂತರ ಜಂತುಹುಳು ನಿವಾರಣೆಗೆ ಅನುಮತಿ ಕೊಡುತ್ತದೆ; ಆರಂಭಿಕ ಗರ್ಭಾವಸ್ಥೆಯಲ್ಲಿ ಕೊಡುವುದಿಲ್ಲ.", "a": 1}}, {"id": "nutrition-9", "topic": "nutrition", "q": "Using iodised salt in cooking mainly prevents:", "o": ["Anaemia", "Goitre and other iodine-deficiency disorders", "Night blindness", "Diarrhoea"], "a": 1, "why": "Iodised salt prevents iodine-deficiency disorders including goitre and cretinism; test salt with a salt-testing kit during home visits.", "hi": {"q": "खाना बनाने में आयोडीन युक्त नमक का उपयोग मुख्य रूप से किससे बचाता है?", "o": ["एनीमिया", "घेंघा और अन्य आयोडीन-कमी रोग", "रतौंधी", "दस्त"], "a": 1, "why": "आयोडीन युक्त नमक घेंघा और क्रेटिनिज़्म जैसे आयोडीन-कमी रोगों से बचाता है; घर भेंट के दौरान नमक जांच किट से नमक जांचें।"}, "kn": {"q": "ಅಡುಗೆಯಲ್ಲಿ ಅಯೋಡಿನ್ ಉಪ್ಪು ಬಳಸುವುದು ಮುಖ್ಯವಾಗಿ ಯಾವುದನ್ನು ತಡೆಯುತ್ತದೆ?", "o": ["ರಕ್ತಹೀನತೆ", "ಗಳಗಂಡ ಮತ್ತು ಇತರ ಅಯೋಡಿನ್ ಕೊರತೆ ರೋಗಗಳು", "ಇರುಳುಗುರುಡು", "ಭೇದಿ"], "why": "ಅಯೋಡಿನ್ ಉಪ್ಪು ಗಳಗಂಡ, ಕ್ರೆಟಿನಿಸಂ ಸೇರಿದಂತೆ ಅಯೋಡಿನ್ ಕೊರತೆ ರೋಗಗಳನ್ನು ತಡೆಯುತ್ತದೆ; ಮನೆ ಭೇಟಿಯಲ್ಲಿ ಉಪ್ಪು ಪರೀಕ್ಷಾ ಕಿಟ್‌ನಿಂದ ಪರೀಕ್ಷಿಸಿ.", "a": 1}}, {"id": "nutrition-10", "topic": "nutrition", "q": "The 'first 1000 days' of life refers to:", "o": ["Birth to school age", "Conception to the child's 2nd birthday", "Birth to 6 months", "The first month of life"], "a": 1, "why": "The window from conception to age 2 is when growth and brain development are most sensitive to nutrition, making ANC, exclusive breastfeeding and complementary feeding the highest-value investments.", "hi": {"q": "जीवन के 'पहले 1000 दिन' का अर्थ है:", "o": ["जन्म से स्कूल जाने की उम्र तक", "गर्भधारण से बच्चे के दूसरे जन्मदिन तक", "जन्म से 6 महीने तक", "जीवन का पहला महीना"], "a": 1, "why": "गर्भधारण से 2 साल की उम्र तक का समय वह है जब विकास और दिमाग का विकास पोषण पर सबसे ज़्यादा निर्भर होता है; इसलिए ANC, केवल स्तनपान और पूरक आहार सबसे कीमती निवेश हैं।"}, "kn": {"q": "ಜೀವನದ 'ಮೊದಲ 1000 ದಿನಗಳು' ಎಂದರೆ:", "o": ["ಹುಟ್ಟಿನಿಂದ ಶಾಲಾ ವಯಸ್ಸಿನವರೆಗೆ", "ಗರ್ಭಧಾರಣೆಯಿಂದ ಮಗುವಿನ 2ನೇ ಹುಟ್ಟುಹಬ್ಬದವರೆಗೆ", "ಹುಟ್ಟಿನಿಂದ 6 ತಿಂಗಳವರೆಗೆ", "ಜೀವನದ ಮೊದಲ ತಿಂಗಳು"], "why": "ಗರ್ಭಧಾರಣೆಯಿಂದ 2 ವರ್ಷದವರೆಗಿನ ಅವಧಿಯಲ್ಲಿ ಬೆಳವಣಿಗೆ ಮತ್ತು ಮೆದುಳಿನ ವಿಕಾಸ ಪೋಷಣೆಗೆ ಅತಿ ಸೂಕ್ಷ್ಮ; ಆದ್ದರಿಂದ ANC, ಕೇವಲ ಎದೆಹಾಲು ಮತ್ತು ಪೂರಕ ಆಹಾರ ಅತಿ ಮೌಲ್ಯದ ಹೂಡಿಕೆ.", "a": 1}}, {"id": "cd-1", "topic": "cd", "q": "An adult has had a cough for more than 2 weeks. Under NTEP, this should prompt:", "o": ["Cough syrup for 5 days", "Referral for sputum examination / CBNAT testing for TB, free of cost", "Only steam inhalation", "Advice to stop smoking and wait"], "a": 1, "why": "Cough of 2 weeks or more is the TB presumptive case definition. Sputum testing (microscopy/CBNAAT) is free at NTEP facilities; TB treatment is free under Nikshay.", "hi": {"q": "एक वयस्क को 2 हफ्तों से अधिक खांसी है। NTEP के अनुसार क्या करें?", "o": ["5 दिन की खांसी की दवा", "TB की जांच के लिए थूक परीक्षण/CBNAAT (नि:शुल्क) के लिए रेफर करें", "केवल भाप", "धूम्रपान छोड़ने की सलाह देकर इंतज़ार"], "a": 1, "why": "2 हफ्ते या अधिक की खांसी TB के संदिग्ध की परिभाषा है। NTEP केंद्रों पर थूक जांच और TB का इलाज निःशुल्क है (निक्षय)।"}, "kn": {"q": "ಒಬ್ಬ ವಯಸ್ಕರಿಗೆ 2 ವಾರಕ್ಕಿಂತ ಹೆಚ್ಚು ಕೆಮ್ಮು ಇದೆ. NTEP ಪ್ರಕಾರ ಏನು ಮಾಡಬೇಕು?", "o": ["5 ದಿನ ಕೆಮ್ಮಿನ ಸಿರಪ್", "TB ಗಾಗಿ ಕಫ ಪರೀಕ್ಷೆ / CBNAAT ಗೆ ಉಚಿತವಾಗಿ ರೆಫರ್ ಮಾಡಿ", "ಹಬೆ ತೆಗೆದುಕೊಳ್ಳುವುದು ಮಾತ್ರ", "ಧೂಮಪಾನ ಬಿಡಲು ಹೇಳಿ ಕಾಯಿರಿ"], "why": "2 ವಾರ ಅಥವಾ ಹೆಚ್ಚು ಕೆಮ್ಮು TB ಶಂಕಿತ ಪ್ರಕರಣದ ವ್ಯಾಖ್ಯಾನ. NTEP ಕೇಂದ್ರಗಳಲ್ಲಿ ಕಫ ಪರೀಕ್ಷೆ ಮತ್ತು TB ಚಿಕಿತ್ಸೆ ಉಚಿತ (ನಿಕ್ಷಯ್).", "a": 1}}, {"id": "cd-2", "topic": "cd", "q": "Before treating suspected malaria, the correct step at the field level is:", "o": ["Treat all fevers with antimalarials", "Confirm with a rapid diagnostic test (RDT) or blood slide first", "Give antibiotics instead", "Wait for the fever to settle on its own"], "a": 1, "why": "National malaria policy requires parasitological confirmation (RDT or slide) before treatment wherever possible, with the right drug for the right parasite.", "hi": {"q": "संदिग्ध मलेरिया का इलाज करने से पहले फील्ड स्तर पर सही कदम क्या है?", "o": ["हर बुखार का मलेरिया-रोधी दवा से इलाज", "पहले रैपिड डायग्नोस्टिक टेस्ट (RDT) या ब्लड स्लाइड से पुष्टि करें", "इसकी जगह एंटीबायोटिक दें", "बुखार अपने आप उतरने का इंतज़ार करें"], "a": 1, "why": "राष्ट्रीय मलेरिया नीति के अनुसार जहाँ संभव हो इलाज से पहले परजीवी की पुष्टि (RDT या स्लाइड) ज़रूरी है, ताकि सही परजीवी के लिए सही दवा दी जाए।"}, "kn": {"q": "ಶಂಕಿತ ಮಲೇರಿಯಾಕ್ಕೆ ಚಿಕಿತ್ಸೆ ಕೊಡುವ ಮೊದಲು ಕ್ಷೇತ್ರ ಮಟ್ಟದಲ್ಲಿ ಸರಿಯಾದ ಹೆಜ್ಜೆ:", "o": ["ಎಲ್ಲಾ ಜ್ವರಕ್ಕೂ ಮಲೇರಿಯಾ ಔಷಧಿ", "ಮೊದಲು ರ್ಯಾಪಿಡ್ ಟೆಸ್ಟ್ (RDT) ಅಥವಾ ರಕ್ತ ಸ್ಲೈಡ್‌ನಿಂದ ದೃಢಪಡಿಸಿ", "ಬದಲಿಗೆ ಆ್ಯಂಟಿಬಯೋಟಿಕ್ ಕೊಡಿ", "ಜ್ವರ ತಾನಾಗಿ ಇಳಿಯಲು ಕಾಯಿರಿ"], "why": "ರಾಷ್ಟ್ರೀಯ ಮಲೇರಿಯಾ ನೀತಿ ಪ್ರಕಾರ ಸಾಧ್ಯವಿರುವಲ್ಲೆಲ್ಲಾ ಚಿಕಿತ್ಸೆಗೆ ಮೊದಲು ಪರಾವಲಂಬಿ ದೃಢೀಕರಣ (RDT ಅಥವಾ ಸ್ಲೈಡ್) ಬೇಕು, ಸರಿಯಾದ ಪರಾವಲಂಬಿಗೆ ಸರಿಯಾದ ಔಷಧಿಗಾಗಿ.", "a": 1}}, {"id": "cd-3", "topic": "cd", "q": "Which of the following are dengue WARNING signs that need hospital care?", "o": ["Fever with body ache for 2 days", "Severe abdominal pain, persistent vomiting, bleeding gums, restlessness", "Rash on the trunk only", "Mild runny nose"], "a": 1, "why": "Dengue warning signs appear as fever settles (days 3-7) and mark the critical leaky phase. Any warning sign means immediate hospital referral.", "hi": {"q": "इनमें से डेंगू के कौन-से चेतावनी संकेत हैं जिनमें अस्पताल में इलाज चाहिए?", "o": ["2 दिन से बुखार और बदन दर्द", "तेज़ पेट दर्द, लगातार उल्टी, मसूड़ों से खून, बेचैनी", "केवल धड़ पर दाने", "हल्की बहती नाक"], "a": 1, "why": "डेंगू के चेतावनी संकेत बुखार उतरते समय (दिन 3-7) आते हैं और यह खतरनाक 'लीक' चरण होता है। कोई भी चेतावनी संकेत हो तो तुरंत अस्पताल रेफर करें।"}, "kn": {"q": "ಆಸ್ಪತ್ರೆ ಚಿಕಿತ್ಸೆ ಬೇಕಾದ ಡೆಂಗ್ಯೂ ಎಚ್ಚರಿಕೆ ಲಕ್ಷಣಗಳು ಯಾವುವು?", "o": ["2 ದಿನದಿಂದ ಜ್ವರ ಮತ್ತು ಮೈಕೈ ನೋವು", "ತೀವ್ರ ಹೊಟ್ಟೆನೋವು, ನಿರಂತರ ವಾಂತಿ, ಒಸಡಿನಿಂದ ರಕ್ತ, ಚಡಪಡಿಕೆ", "ಮುಂಡದ ಮೇಲೆ ಮಾತ್ರ ದದ್ದು", "ಸ್ವಲ್ಪ ಮೂಗು ಸೋರುವಿಕೆ"], "why": "ಡೆಂಗ್ಯೂ ಎಚ್ಚರಿಕೆ ಲಕ್ಷಣಗಳು ಜ್ವರ ಇಳಿಯುವಾಗ (ದಿನ 3-7) ಬರುತ್ತವೆ; ಇದು ಅಪಾಯಕಾರಿ ಹಂತ. ಯಾವುದೇ ಎಚ್ಚರಿಕೆ ಲಕ್ಷಣ ಇದ್ದರೆ ತಕ್ಷಣ ಆಸ್ಪತ್ರೆಗೆ ರೆಫರ್ ಮಾಡಿ.", "a": 1}}, {"id": "cd-4", "topic": "cd", "q": "An early patch of leprosy typically looks like:", "o": ["An itchy red rash that peels", "A hypopigmented (light) patch with loss of sensation", "A painful blister", "Dark spots on palms"], "a": 1, "why": "Painless, light-coloured patches with reduced sensation are the hallmark; early MDT treatment is free and cures leprosy and prevents deformity.", "hi": {"q": "कुष्ठ रोग का शुरुआती धब्बा आम तौर पर कैसा दिखता है?", "o": ["खुजली वाला लाल दाना जो छिलता है", "हल्के रंग का धब्बा जिसमें सुन्नपन (संवेदना की कमी) हो", "दर्द वाला छाला", "हथेलियों पर काले धब्बे"], "a": 1, "why": "बिना दर्द के हल्के रंग के धब्बे जिनमें संवेदना कम हो, इसकी पहचान हैं; जल्दी MDT इलाज मुफ्त है, कुष्ठ ठीक करता है और विकृति रोकता है।"}, "kn": {"q": "ಕುಷ್ಠರೋಗದ ಆರಂಭಿಕ ಮಚ್ಚೆ ಸಾಮಾನ್ಯವಾಗಿ ಹೇಗಿರುತ್ತದೆ?", "o": ["ಸಿಪ್ಪೆ ಏಳುವ ತುರಿಕೆಯ ಕೆಂಪು ದದ್ದು", "ಸ್ಪರ್ಶ ಸಂವೇದನೆ ಇಲ್ಲದ ತಿಳಿ ಬಣ್ಣದ ಮಚ್ಚೆ", "ನೋವಿನ ಗುಳ್ಳೆ", "ಅಂಗೈಯಲ್ಲಿ ಕಪ್ಪು ಮಚ್ಚೆ"], "why": "ನೋವಿಲ್ಲದ, ಸಂವೇದನೆ ಕಡಿಮೆ ಇರುವ ತಿಳಿ ಬಣ್ಣದ ಮಚ್ಚೆಗಳು ಮುಖ್ಯ ಗುರುತು; ಬೇಗ MDT ಚಿಕಿತ್ಸೆ ಉಚಿತ, ಕುಷ್ಠರೋಗ ಗುಣಪಡಿಸುತ್ತದೆ ಮತ್ತು ವಿಕಲತೆ ತಡೆಯುತ್ತದೆ.", "a": 1}}, {"id": "cd-5", "topic": "cd", "q": "In lymphatic filariasis endemic blocks, the annual Mass Drug Administration (MDA) involves giving:", "o": ["A single annual dose of DEC + albendazole to the whole community", "Daily tablets for a month to children only", "Vaccination twice a year", "Nothing; it is treated only after symptoms appear"], "a": 0, "why": "Annual single-dose DEC+albendazole to the eligible population interrupts transmission; India targets elimination of lymphatic filariasis.", "hi": {"q": "फाइलेरिया प्रभावित ब्लॉकों में सालाना सामूहिक दवा सेवन (MDA) में क्या दिया जाता है?", "o": ["पूरे समुदाय को DEC + एल्बेंडाज़ोल की साल में एक खुराक", "केवल बच्चों को एक महीने रोज़ गोलियाँ", "साल में दो बार टीका", "कुछ नहीं; लक्षण आने पर ही इलाज"], "a": 0, "why": "योग्य आबादी को साल में एक बार DEC+एल्बेंडाज़ोल की खुराक संक्रमण की कड़ी तोड़ती है; भारत का लक्ष्य लिम्फैटिक फाइलेरिया का उन्मूलन है।"}, "kn": {"q": "ಆನೆಕಾಲು ರೋಗ (ಫೈಲೇರಿಯಾ) ಇರುವ ಬ್ಲಾಕ್‌ಗಳಲ್ಲಿ ವಾರ್ಷಿಕ ಸಾಮೂಹಿಕ ಔಷಧಿ ವಿತರಣೆ (MDA) ಯಲ್ಲಿ ಏನು ಕೊಡುತ್ತಾರೆ?", "o": ["ಇಡೀ ಸಮುದಾಯಕ್ಕೆ ವರ್ಷಕ್ಕೊಮ್ಮೆ DEC + ಆಲ್ಬೆಂಡಜೋಲ್ ಒಂದು ಡೋಸ್", "ಮಕ್ಕಳಿಗೆ ಮಾತ್ರ ಒಂದು ತಿಂಗಳು ದಿನವೂ ಮಾತ್ರೆ", "ವರ್ಷಕ್ಕೆ ಎರಡು ಬಾರಿ ಲಸಿಕೆ", "ಏನೂ ಇಲ್ಲ; ಲಕ್ಷಣ ಬಂದ ಮೇಲೆ ಮಾತ್ರ ಚಿಕಿತ್ಸೆ"], "why": "ಅರ್ಹ ಜನರಿಗೆ ವರ್ಷಕ್ಕೊಮ್ಮೆ DEC+ಆಲ್ಬೆಂಡಜೋಲ್ ಡೋಸ್ ಹರಡುವಿಕೆ ತಡೆಯುತ್ತದೆ; ಭಾರತದ ಗುರಿ ಆನೆಕಾಲು ರೋಗ ನಿರ್ಮೂಲನೆ.", "a": 0}}, {"id": "cd-6", "topic": "cd", "q": "Immediately after a dog bite, the FIRST step is:", "o": ["Apply chilli/turmeric to the wound", "Wash the wound with soap and running water for 10-15 minutes, then go for anti-rabies vaccine (and immunoglobulin if category III)", "Tie a tight rope above the wound for an hour", "Ignore it if the dog looks healthy"], "a": 1, "why": "Thorough soap-and-water washing for 10-15 minutes plus prompt ARV (with RIG for category III/transdermal bites) prevents virtually all rabies deaths.", "hi": {"q": "कुत्ते के काटने के तुरंत बाद पहला कदम है:", "o": ["घाव पर मिर्च/हल्दी लगाएँ", "घाव को साबुन और बहते पानी से 10-15 मिनट धोएँ, फिर एंटी-रेबीज़ टीका (और श्रेणी III में इम्यूनोग्लोबुलिन) लगवाएँ", "घाव के ऊपर एक घंटे के लिए कसकर रस्सी बाँधें", "कुत्ता स्वस्थ दिखे तो अनदेखा करें"], "a": 1, "why": "10-15 मिनट साबुन-पानी से अच्छी तरह धोना और जल्दी ARV (श्रेणी III/गहरे काटने पर RIG के साथ) रेबीज़ से होने वाली लगभग सभी मौतें रोकता है।"}, "kn": {"q": "ನಾಯಿ ಕಚ್ಚಿದ ತಕ್ಷಣ ಮೊದಲ ಹೆಜ್ಜೆ:", "o": ["ಗಾಯಕ್ಕೆ ಮೆಣಸಿನಕಾಯಿ/ಅರಿಶಿನ ಹಚ್ಚಿ", "ಗಾಯವನ್ನು ಸಾಬೂನು ಮತ್ತು ಹರಿಯುವ ನೀರಿನಿಂದ 10-15 ನಿಮಿಷ ತೊಳೆಯಿರಿ, ನಂತರ ರೇಬೀಸ್ ಲಸಿಕೆ (ವರ್ಗ III ಆದರೆ ಇಮ್ಯುನೊಗ್ಲೋಬ್ಯುಲಿನ್ ಕೂಡ)", "ಗಾಯದ ಮೇಲೆ ಒಂದು ಗಂಟೆ ಹಗ್ಗ ಬಿಗಿಯಾಗಿ ಕಟ್ಟಿ", "ನಾಯಿ ಆರೋಗ್ಯವಾಗಿ ಕಂಡರೆ ಬಿಟ್ಟುಬಿಡಿ"], "why": "10-15 ನಿಮಿಷ ಸಾಬೂನು-ನೀರಿನಿಂದ ಚೆನ್ನಾಗಿ ತೊಳೆಯುವುದು ಮತ್ತು ಬೇಗ ARV (ವರ್ಗ III ಕಡಿತಕ್ಕೆ RIG ಜೊತೆ) ಬಹುತೇಕ ಎಲ್ಲಾ ರೇಬೀಸ್ ಸಾವುಗಳನ್ನು ತಡೆಯುತ್ತದೆ.", "a": 1}}, {"id": "cd-7", "topic": "cd", "q": "As per IMNCI, 'fast breathing' in an infant aged 2 months to 12 months is:", "o": ["30 breaths per minute or more", "40 breaths per minute or more", "50 breaths per minute or more", "60 breaths per minute or more"], "a": 2, "why": "IMNCI cut-offs: 2-12 months, 50 or more breaths/minute; 12-59 months, 40 or more. Fast breathing with other signs means possible pneumonia and referral for assessment.", "hi": {"q": "IMNCI के अनुसार 2 से 12 महीने के शिशु में 'तेज़ सांस' कितनी है?", "o": ["30 या अधिक सांस प्रति मिनट", "40 या अधिक सांस प्रति मिनट", "50 या अधिक सांस प्रति मिनट", "60 या अधिक सांस प्रति मिनट"], "a": 2, "why": "IMNCI सीमाएँ: 2-12 महीने में 50 या अधिक सांस/मिनट; 12-59 महीने में 40 या अधिक। अन्य संकेतों के साथ तेज़ सांस संभावित निमोनिया है, जांच के लिए रेफर करें।"}, "kn": {"q": "IMNCI ಪ್ರಕಾರ 2 ರಿಂದ 12 ತಿಂಗಳ ಶಿಶುವಿನಲ್ಲಿ 'ವೇಗದ ಉಸಿರಾಟ' ಎಂದರೆ:", "o": ["ನಿಮಿಷಕ್ಕೆ 30 ಅಥವಾ ಹೆಚ್ಚು", "ನಿಮಿಷಕ್ಕೆ 40 ಅಥವಾ ಹೆಚ್ಚು", "ನಿಮಿಷಕ್ಕೆ 50 ಅಥವಾ ಹೆಚ್ಚು", "ನಿಮಿಷಕ್ಕೆ 60 ಅಥವಾ ಹೆಚ್ಚು"], "why": "IMNCI ಮಿತಿ: 2-12 ತಿಂಗಳು, ನಿಮಿಷಕ್ಕೆ 50 ಅಥವಾ ಹೆಚ್ಚು; 12-59 ತಿಂಗಳು, 40 ಅಥವಾ ಹೆಚ್ಚು. ಇತರ ಲಕ್ಷಣಗಳ ಜೊತೆ ವೇಗದ ಉಸಿರಾಟ ಎಂದರೆ ನ್ಯುಮೋನಿಯಾ ಸಾಧ್ಯತೆ; ಪರೀಕ್ಷೆಗೆ ರೆಫರ್ ಮಾಡಿ.", "a": 2}}, {"id": "cd-8", "topic": "cd", "q": "Kala-azar (visceral leishmaniasis) is transmitted by:", "o": ["Aedes mosquitoes", "Sandflies", "Houseflies", "Ticks"], "a": 1, "why": "The sandfly (Phlebotomus argentipes) transmits kala-azar; control includes indoor residual spraying and vector surveillance.", "hi": {"q": "काला-अज़ार (विसरल लीशमैनियासिस) किसके द्वारा फैलता है?", "o": ["एडीज़ मच्छर", "सैंडफ्लाई (बालू मक्खी)", "घरेलू मक्खी", "किलनी (टिक)"], "a": 1, "why": "सैंडफ्लाई (फ्लेबोटोमस अर्जेन्टिपीज़) काला-अज़ार फैलाती है; नियंत्रण में घर के अंदर कीटनाशक छिड़काव और वेक्टर निगरानी शामिल हैं।"}, "kn": {"q": "ಕಾಲಾ-ಅಜಾರ್ (ವಿಸರಲ್ ಲೀಶ್ಮೇನಿಯಾಸಿಸ್) ಯಾವುದರಿಂದ ಹರಡುತ್ತದೆ?", "o": ["ಏಡಿಸ್ ಸೊಳ್ಳೆ", "ಮರಳು ನೊಣ (ಸ್ಯಾಂಡ್‌ಫ್ಲೈ)", "ಮನೆ ನೊಣ", "ಉಣ್ಣೆ (ಟಿಕ್)"], "why": "ಮರಳು ನೊಣ (ಫ್ಲೆಬೊಟೊಮಸ್ ಅರ್ಜೆಂಟಿಪ್ಸ್) ಕಾಲಾ-ಅಜಾರ್ ಹರಡುತ್ತದೆ; ನಿಯಂತ್ರಣದಲ್ಲಿ ಮನೆಯೊಳಗೆ ಕೀಟನಾಶಕ ಸಿಂಪಡಣೆ ಮತ್ತು ವಾಹಕ ನಿಗಾ ಸೇರಿವೆ.", "a": 1}}, {"id": "cd-9", "topic": "cd", "q": "Under PPTCT services, every pregnant woman should be:", "o": ["Tested for HIV and syphilis once during ANC", "Tested only if she looks ill", "Vaccinated against HIV", "Told testing is optional and never offered"], "a": 0, "why": "Universal ANC screening for HIV and syphilis links positive mothers to lifelong ART and infant prophylaxis, preventing mother-to-child transmission.", "hi": {"q": "PPTCT सेवाओं के तहत हर गर्भवती महिला की:", "o": ["ANC के दौरान एक बार HIV और सिफलिस जांच होनी चाहिए", "केवल बीमार दिखने पर जांच", "HIV का टीका लगना चाहिए", "जांच वैकल्पिक बताकर कभी पेश न करें"], "a": 0, "why": "सभी ANC में HIV और सिफलिस जांच से पॉज़िटिव माताओं को आजीवन ART और शिशु को बचाव दवा मिलती है, जिससे माँ से बच्चे में संक्रमण रुकता है।"}, "kn": {"q": "PPTCT ಸೇವೆಗಳ ಅಡಿ ಪ್ರತಿ ಗರ್ಭಿಣಿಗೆ:", "o": ["ANC ವೇಳೆ ಒಮ್ಮೆ HIV ಮತ್ತು ಸಿಫಿಲಿಸ್ ಪರೀಕ್ಷೆ ಆಗಬೇಕು", "ಅಸ್ವಸ್ಥರಾಗಿ ಕಂಡರೆ ಮಾತ್ರ ಪರೀಕ್ಷೆ", "HIV ಲಸಿಕೆ ಹಾಕಬೇಕು", "ಪರೀಕ್ಷೆ ಐಚ್ಛಿಕ ಎಂದು ಹೇಳಿ ಎಂದೂ ಕೊಡಬಾರದು"], "why": "ಎಲ್ಲಾ ANC ಯಲ್ಲಿ HIV ಮತ್ತು ಸಿಫಿಲಿಸ್ ಪರೀಕ್ಷೆಯಿಂದ ಪಾಸಿಟಿವ್ ತಾಯಂದಿರಿಗೆ ಜೀವನಪರ್ಯಂತ ART ಮತ್ತು ಶಿಶುವಿಗೆ ರಕ್ಷಣಾ ಔಷಧಿ ಸಿಗುತ್ತದೆ; ತಾಯಿಯಿಂದ ಮಗುವಿಗೆ ಹರಡುವುದು ತಡೆಯುತ್ತದೆ.", "a": 0}}, {"id": "cd-10", "topic": "cd", "q": "Which pair of measures most reliably prevents diarrhoea and cholera in a village?", "o": ["Boiled or chlorinated drinking water, safe sanitation and handwashing", "Daily vitamin drops", "Avoiding bathing in summer", "Eating only cooked food cold"], "a": 0, "why": "Safe water, sanitation and hand hygiene remain the backbone of diarrhoeal disease control, alongside ORS and zinc for treatment.", "hi": {"q": "गाँव में दस्त और हैज़ा रोकने का सबसे भरोसेमंद उपाय कौन-सा है?", "o": ["उबला या क्लोरीन मिला पीने का पानी, सुरक्षित शौचालय और हाथ धोना", "रोज़ विटामिन की बूँदें", "गर्मियों में नहाना बंद", "केवल ठंडा पका खाना"], "a": 0, "why": "सुरक्षित पानी, स्वच्छता और हाथों की सफाई दस्त रोग नियंत्रण की रीढ़ हैं, साथ में इलाज के लिए ORS और जिंक।"}, "kn": {"q": "ಹಳ್ಳಿಯಲ್ಲಿ ಭೇದಿ ಮತ್ತು ಕಾಲರಾ ತಡೆಯಲು ಅತಿ ನಂಬಿಕೆಯ ಕ್ರಮ ಯಾವುದು?", "o": ["ಕುದಿಸಿದ ಅಥವಾ ಕ್ಲೋರಿನ್ ಹಾಕಿದ ಕುಡಿಯುವ ನೀರು, ಸುರಕ್ಷಿತ ಶೌಚಾಲಯ ಮತ್ತು ಕೈ ತೊಳೆಯುವಿಕೆ", "ದಿನವೂ ವಿಟಮಿನ್ ಹನಿ", "ಬೇಸಿಗೆಯಲ್ಲಿ ಸ್ನಾನ ಬಿಡುವುದು", "ಬೇಯಿಸಿದ ಆಹಾರವನ್ನು ತಣ್ಣಗೆ ಮಾತ್ರ ತಿನ್ನುವುದು"], "why": "ಸುರಕ್ಷಿತ ನೀರು, ನೈರ್ಮಲ್ಯ ಮತ್ತು ಕೈ ಸ್ವಚ್ಛತೆ ಭೇದಿ ರೋಗ ನಿಯಂತ್ರಣದ ಬೆನ್ನೆಲುಬು; ಚಿಕಿತ್ಸೆಗೆ ORS ಮತ್ತು ಜಿಂಕ್ ಜೊತೆ.", "a": 0}}, {"id": "emergency-1", "topic": "emergency", "q": "A 20-day-old newborn is breathing 68 times per minute. This is:", "o": ["Normal for newborns", "Fast breathing; possible serious infection needing urgent referral", "Nothing to worry about unless the baby cries", "Normal if the baby is feeding"], "a": 1, "why": "In newborns 0-59 days, 60 breaths/minute or more is fast breathing. With poor feeding or lethargy it suggests serious bacterial infection; the baby needs urgent assessment and referral.", "hi": {"q": "20 दिन के नवजात शिशु की सांसें प्रति मिनट 68 बार हैं। यह:", "o": ["नवजातों के लिए सामान्य है", "तेज़ सांसें; संभावित गंभीर संक्रमण, तुरंत रेफर करें", "चिंता की कोई बात नहीं", "बच्चा दूध पी रहा है तो सामान्य"], "a": 1, "why": "0-59 दिन के नवजात में 60 या अधिक सांसें प्रति मिनट तेज़ सांस मानी जाती हैं। दूध न पीना या सुस्ती के साथ यह गंभीर बैक्टीरियल संक्रमण का संकेत है; तुरंत रेफर करें।"}, "kn": {"q": "20 ದಿನದ ನವಜಾತ ಶಿಶು ನಿಮಿಷಕ್ಕೆ 68 ಬಾರಿ ಉಸಿರಾಡುತ್ತಿದೆ. ಇದು:", "o": ["ನವಜಾತರಿಗೆ ಸಾಮಾನ್ಯ", "ವೇಗದ ಉಸಿರಾಟ; ಗಂಭೀರ ಸೋಂಕು ಸಾಧ್ಯ, ತಕ್ಷಣ ರೆಫರ್ ಮಾಡಿ", "ಮಗು ಅಳದಿದ್ದರೆ ಚಿಂತೆ ಬೇಡ", "ಮಗು ಹಾಲು ಕುಡಿಯುತ್ತಿದ್ದರೆ ಸಾಮಾನ್ಯ"], "why": "0-59 ದಿನದ ನವಜಾತರಲ್ಲಿ ನಿಮಿಷಕ್ಕೆ 60 ಅಥವಾ ಹೆಚ್ಚು ಉಸಿರಾಟ ವೇಗದ ಉಸಿರಾಟ. ಹಾಲು ಕುಡಿಯದಿರುವುದು ಅಥವಾ ಜಡತೆ ಜೊತೆ ಇದ್ದರೆ ಗಂಭೀರ ಬ್ಯಾಕ್ಟೀರಿಯಾ ಸೋಂಕಿನ ಸೂಚನೆ; ತಕ್ಷಣ ರೆಫರ್ ಮಾಡಿ.", "a": 1}}, {"id": "emergency-2", "topic": "emergency", "q": "A newborn's axillary temperature is 35.8°C. This means:", "o": ["Normal temperature", "Fever", "Hypothermia; warm the baby with skin-to-skin contact immediately", "The thermometer is faulty, always"], "a": 2, "why": "Normal axillary temperature is 36.5-37.5°C. Below 36.5°C is hypothermia: rewarm with skin-to-skin contact, cover the head, ensure feeding, and refer if the baby does not warm up.", "hi": {"q": "नवजात शिशु का बगल का तापमान 35.8°C है। इसका अर्थ:", "o": ["सामान्य तापमान", "बुखार", "हाइपोथर्मिया (ठंड); तुरंत कंगारू केयर (छाती से छूकर) से गर्म करें", "थर्मामीटर खराब है"], "a": 2, "why": "बगल का सामान्य तापमान 36.5-37.5°C है। 36.5°C से कम ठंड है: त्वचा-से-त्वचा संपर्क से गर्म करें, सिर ढकें, दूध पिलाएँ; ठीक न हो तो रेफर करें।"}, "kn": {"q": "ನವಜಾತ ಶಿಶುವಿನ ಕಂಕುಳಿನ ಉಷ್ಣತೆ 35.8°C ಇದೆ. ಇದರ ಅರ್ಥ:", "o": ["ಸಾಮಾನ್ಯ ಉಷ್ಣತೆ", "ಜ್ವರ", "ಹೈಪೋಥರ್ಮಿಯಾ (ಚಳಿ); ತಕ್ಷಣ ಚರ್ಮ-ಚರ್ಮ ಸಂಪರ್ಕದಿಂದ ಬೆಚ್ಚಗೆ ಮಾಡಿ", "ಥರ್ಮಾಮೀಟರ್ ಯಾವಾಗಲೂ ಹಾಳಾಗಿದೆ"], "why": "ಸಾಮಾನ್ಯ ಕಂಕುಳಿನ ಉಷ್ಣತೆ 36.5-37.5°C. 36.5°C ಗಿಂತ ಕಡಿಮೆ ಎಂದರೆ ಚಳಿ: ಚರ್ಮ-ಚರ್ಮ ಸಂಪರ್ಕದಿಂದ ಬೆಚ್ಚಗೆ ಮಾಡಿ, ತಲೆ ಮುಚ್ಚಿ, ಹಾಲುಣಿಸಿ; ಬೆಚ್ಚಗಾಗದಿದ್ದರೆ ರೆಫರ್ ಮಾಡಿ.", "a": 2}}, {"id": "emergency-3", "topic": "emergency", "q": "A 3-year-old has a seizure (fits) with fever. What should you do FIRST and always?", "o": ["Put a spoon in the mouth to stop tongue biting", "Place the child on a safe surface, do not restrain, do not put anything in the mouth, and arrange urgent care", "Give the child water to drink", "Shake the child to wake them up"], "a": 1, "why": "Never force anything into the mouth. Protect from injury, time the episode, and get urgent care; with fever think of meningitis or malaria as well as simple febrile fits.", "hi": {"q": "बुखार के साथ 3 साल के बच्चे को दौरे (झटके) आ रहे हैं। सबसे पहले क्या करें?", "o": ["मुँह में चम्मच डालें", "बच्चे को सुरक्षित जगह लिटाएँ, मुँह में कुछ न डालें, न रोकें, और तुरंत उपचार की व्यवस्था करें", "पानी पिलाएँ", "जगाने के लिए हिलाएँ"], "a": 1, "why": "मुँह में कभी कुछ न डालें। चोट से बचाएँ, दौरे का समय नोट करें और तुरंत स्वास्थ्य सेवा तक पहुँचाएँ; बुखार के साथ मैनिनजाइटिस या मलेरिया भी सोचें।"}, "kn": {"q": "3 ವರ್ಷದ ಮಗುವಿಗೆ ಜ್ವರದ ಜೊತೆ ಸೆಳೆತ (ಫಿಟ್ಸ್) ಬಂದಿದೆ. ಮೊದಲು ಮತ್ತು ಯಾವಾಗಲೂ ಏನು ಮಾಡಬೇಕು?", "o": ["ನಾಲಿಗೆ ಕಚ್ಚದಂತೆ ಬಾಯಿಗೆ ಚಮಚ ಇಡಿ", "ಮಗುವನ್ನು ಸುರಕ್ಷಿತ ಜಾಗದಲ್ಲಿ ಮಲಗಿಸಿ, ಹಿಡಿದಿಡಬೇಡಿ, ಬಾಯಿಗೆ ಏನೂ ಹಾಕಬೇಡಿ, ತುರ್ತು ಚಿಕಿತ್ಸೆ ವ್ಯವಸ್ಥೆ ಮಾಡಿ", "ನೀರು ಕುಡಿಸಿ", "ಎಬ್ಬಿಸಲು ಅಲುಗಾಡಿಸಿ"], "why": "ಬಾಯಿಗೆ ಬಲವಂತವಾಗಿ ಏನನ್ನೂ ಹಾಕಬೇಡಿ. ಗಾಯದಿಂದ ರಕ್ಷಿಸಿ, ಸೆಳೆತದ ಸಮಯ ಗಮನಿಸಿ, ತುರ್ತು ಚಿಕಿತ್ಸೆಗೆ ಕರೆದೊಯ್ಯಿರಿ; ಜ್ವರ ಇದ್ದರೆ ಮೆನಿಂಜೈಟಿಸ್ ಅಥವಾ ಮಲೇರಿಯಾ ಬಗ್ಗೆಯೂ ಯೋಚಿಸಿ.", "a": 1}}, {"id": "emergency-4", "topic": "emergency", "q": "A child has swallowed kerosene stored in a soft-drink bottle. Correct first action?", "o": ["Make the child vomit immediately", "Do NOT induce vomiting; carry the container and rush to the health facility", "Give milk and send home", "Give salt water to drink"], "a": 1, "why": "Inducing vomiting after hydrocarbon (kerosene) ingestion risks aspiration into the lungs. Keep the container for identification and reach the facility quickly.", "hi": {"q": "बच्चा केरोसिन (मिट्टी का तेल) निगल गया है जो कोल्ड-ड्रिंक की बोतल में रखा था। पहला कदम?", "o": ["तुरंत उल्टी करवाएँ", "उल्टी न करवाएँ; बोतल साथ लेकर तुरंत स्वास्थ्य केंद्र पहुँचाएँ", "दूध पिलाकर घर भेज दें", "नमक-पानी दें"], "a": 1, "why": "केरोसिन के बाद उल्टी करवाने से फेफड़ों में जाने (एस्पिरेशन) का खतरा बढ़ता है। बोतल साथ ले जाएँ और जल्दी अस्पताल पहुँचें।"}, "kn": {"q": "ತಂಪು ಪಾನೀಯದ ಬಾಟಲಿಯಲ್ಲಿಟ್ಟ ಸೀಮೆಎಣ್ಣೆಯನ್ನು ಮಗು ಕುಡಿದಿದೆ. ಸರಿಯಾದ ಮೊದಲ ಕ್ರಮ?", "o": ["ತಕ್ಷಣ ವಾಂತಿ ಮಾಡಿಸಿ", "ವಾಂತಿ ಮಾಡಿಸಬೇಡಿ; ಬಾಟಲಿ ಜೊತೆ ತೆಗೆದುಕೊಂಡು ತಕ್ಷಣ ಆರೋಗ್ಯ ಕೇಂದ್ರಕ್ಕೆ ಹೋಗಿ", "ಹಾಲು ಕೊಟ್ಟು ಮನೆಗೆ ಕಳಿಸಿ", "ಉಪ್ಪು ನೀರು ಕುಡಿಸಿ"], "why": "ಸೀಮೆಎಣ್ಣೆ ಕುಡಿದ ನಂತರ ವಾಂತಿ ಮಾಡಿಸಿದರೆ ಅದು ಶ್ವಾಸಕೋಶಕ್ಕೆ ಹೋಗುವ ಅಪಾಯ. ಗುರುತಿಸಲು ಬಾಟಲಿ ಜೊತೆ ಇಟ್ಟುಕೊಂಡು ಬೇಗ ಕೇಂದ್ರ ತಲುಪಿ.", "a": 1}}, {"id": "emergency-5", "topic": "emergency", "q": "Correct first aid for a snake bite on the leg is:", "o": ["Cut the wound and suck the venom out", "Immobilise the limb, keep it at or below heart level, remove rings/tight items, and rush to the hospital for anti-snake venom", "Apply a tight tourniquet above the bite for 2 hours", "Burn the area with a hot iron"], "a": 1, "why": "No cutting, sucking, cautery or tight tourniquets. Splint and immobilise like a fracture, keep the limb low, and reach a facility stocking anti-snake venom fast.", "hi": {"q": "पैर में साँप ने काटा है। सही प्राथमिक उपचार:", "o": ["घाव काटकर जहर चूसें", "पैर को हिलने न दें, हृदय के स्तर पर या नीचे रखें, अंगूठी/तंग चीज़ें हटाएँ और एंटी-स्नेक वेनम के लिए अस्पताल पहुँचें", "पट्टी बहुत कसकर 2 घंटे बाँधें", "घाव पर आग दबाएँ"], "a": 1, "why": "घाव काटना, चूसना, दागना या कसी पट्टी न करें। फ्रैक्चर की तरह अंग को स्थिर रखें, नीचे रखें और जल्दी एंटी-स्नेक वेनम वाले अस्पताल तक पहुँचें।"}, "kn": {"q": "ಕಾಲಿಗೆ ಹಾವು ಕಚ್ಚಿದಾಗ ಸರಿಯಾದ ಪ್ರಥಮ ಚಿಕಿತ್ಸೆ:", "o": ["ಗಾಯ ಕೊಯ್ದು ವಿಷ ಹೀರಿ", "ಕಾಲು ಅಲುಗಾಡದಂತೆ ಇಡಿ, ಹೃದಯದ ಮಟ್ಟದಲ್ಲಿ ಅಥವಾ ಕೆಳಗೆ ಇಡಿ, ಉಂಗುರ/ಬಿಗಿ ವಸ್ತು ತೆಗೆಯಿರಿ, ಹಾವು ವಿಷ ನಿರೋಧಕ (ASV) ಗಾಗಿ ಆಸ್ಪತ್ರೆಗೆ ಧಾವಿಸಿ", "ಕಚ್ಚಿದ ಮೇಲೆ 2 ಗಂಟೆ ಬಿಗಿಯಾಗಿ ಕಟ್ಟಿ", "ಬಿಸಿ ಕಬ್ಬಿಣದಿಂದ ಸುಡಿ"], "why": "ಕೊಯ್ಯುವುದು, ಹೀರುವುದು, ಸುಡುವುದು, ಬಿಗಿ ಕಟ್ಟು ಬೇಡ. ಮೂಳೆ ಮುರಿತದಂತೆ ಸ್ಥಿರಗೊಳಿಸಿ, ಕಾಲು ಕೆಳಗಿಡಿ, ASV ಇರುವ ಆಸ್ಪತ್ರೆಗೆ ಬೇಗ ತಲುಪಿ.", "a": 1}}, {"id": "emergency-6", "topic": "emergency", "q": "A 10-month-old is choking on a coin and cannot cry or breathe. You should:", "o": ["Push a finger deep into the throat blindly", "Give 5 back blows with the baby face-down, then 5 chest thrusts, alternating until the object clears", "Hold the baby upside down and shake", "Wait; children cough things out themselves"], "a": 1, "why": "For infants: alternate 5 back blows and 5 chest thrusts. Blind finger sweeps can push the object deeper. Go for help if it does not clear.", "hi": {"q": "10 महीने का बच्चा सिक्का निगलने की वजह से चोक हो रहा है और रो भी नहीं पा रहा। क्या करें?", "o": ["उंगली घुसाकर ढूँढें", "बच्चे को पेट के बल (मुँह नीचे) रखकर पीठ पर 5 थपकी, फिर 5 बार छाती पर दबाव; वस्तु निकलने तक दोहराएँ", "उल्टा लटकाकर हिलाएँ", "इंतज़ार करें"], "a": 1, "why": "शिशुओं में पीठ पर 5 थपकी और छाती पर 5 दबाव बारी-बारी दोहराएँ। बिना देखे उंगली डालने से वस्तु और अंदर जा सकती है। न निकले तो तुरंत मदद लें।"}, "kn": {"q": "10 ತಿಂಗಳ ಮಗು ನಾಣ್ಯದಿಂದ ಉಸಿರುಗಟ್ಟುತ್ತಿದೆ, ಅಳಲು ಅಥವಾ ಉಸಿರಾಡಲು ಆಗುತ್ತಿಲ್ಲ. ನೀವು:", "o": ["ನೋಡದೆ ಗಂಟಲಿಗೆ ಬೆರಳು ತೂರಿಸಿ", "ಮಗುವನ್ನು ಮುಖ ಕೆಳಗೆ ಮಾಡಿ ಬೆನ್ನಿಗೆ 5 ಏಟು, ನಂತರ 5 ಎದೆ ಒತ್ತು; ವಸ್ತು ಹೊರಬರುವವರೆಗೆ ಬದಲಿಸಿ ಮಾಡಿ", "ತಲೆಕೆಳಗೆ ಹಿಡಿದು ಅಲುಗಾಡಿಸಿ", "ಕಾಯಿರಿ; ಮಕ್ಕಳು ತಾವೇ ಕೆಮ್ಮಿ ಹೊರಹಾಕುತ್ತಾರೆ"], "why": "ಶಿಶುಗಳಿಗೆ: ಬೆನ್ನಿಗೆ 5 ಏಟು ಮತ್ತು ಎದೆಗೆ 5 ಒತ್ತು ಬದಲಿಸಿ ಮಾಡಿ. ನೋಡದೆ ಬೆರಳು ಹಾಕಿದರೆ ವಸ್ತು ಇನ್ನೂ ಒಳಗೆ ಹೋಗಬಹುದು. ಹೊರಬರದಿದ್ದರೆ ತಕ್ಷಣ ಸಹಾಯ ಪಡೆಯಿರಿ.", "a": 1}}, {"id": "emergency-7", "topic": "emergency", "q": "First aid for a fresh burn on a child's arm is:", "o": ["Apply toothpaste or ghee", "Cool the burn under clean running water for 10-20 minutes, then cover with a clean cloth", "Ice directly on the wound", "Pop any blisters that form"], "a": 1, "why": "Cool (not ice-cold) running water for 10-20 minutes is the evidence-based first aid. Never apply toothpaste, oil or ghee and never burst blisters.", "hi": {"q": "बच्चे के हाथ पर ताज़ा जलन (बर्न) है। पहली सहायता:", "o": ["टूथपेस्ट या घी लगाएँ", "साफ बहते पानी से 10-20 मिनट ठंडा करें, फिर साफ कपड़े से ढकें", "सीधा बर्फ लगाएँ", "फफोले फोड़ें"], "a": 1, "why": "10-20 मिनट ठंडा बहता पानी प्रमाणित प्राथमिक उपचार है। टूथपेस्ट, तेल या घी न लगाएँ, फफोले न फोड़ें।"}, "kn": {"q": "ಮಗುವಿನ ಕೈಗೆ ಹೊಸ ಸುಟ್ಟ ಗಾಯಕ್ಕೆ ಪ್ರಥಮ ಚಿಕಿತ್ಸೆ:", "o": ["ಟೂತ್‌ಪೇಸ್ಟ್ ಅಥವಾ ತುಪ್ಪ ಹಚ್ಚಿ", "ಸ್ವಚ್ಛ ಹರಿಯುವ ನೀರಿನಲ್ಲಿ 10-20 ನಿಮಿಷ ತಣ್ಣಗೆ ಮಾಡಿ, ನಂತರ ಸ್ವಚ್ಛ ಬಟ್ಟೆಯಿಂದ ಮುಚ್ಚಿ", "ನೇರವಾಗಿ ಐಸ್ ಇಡಿ", "ಗುಳ್ಳೆಗಳನ್ನು ಒಡೆಯಿರಿ"], "why": "10-20 ನಿಮಿಷ ತಣ್ಣನೆಯ (ಐಸ್ ಅಲ್ಲ) ಹರಿಯುವ ನೀರು ಸಾಬೀತಾದ ಪ್ರಥಮ ಚಿಕಿತ್ಸೆ. ಟೂತ್‌ಪೇಸ್ಟ್, ಎಣ್ಣೆ, ತುಪ್ಪ ಹಚ್ಚಬೇಡಿ, ಗುಳ್ಳೆ ಒಡೆಯಬೇಡಿ.", "a": 1}}, {"id": "emergency-8", "topic": "emergency", "q": "Someone is rescued from a pond and is not breathing. The bystander should:", "o": ["Wait for water to drain out before any help", "Start resuscitation (open airway, rescue breaths, chest compressions) and call for help", "Only perform chest compressions and skip rescue breaths", "Turn the person upside down and run"], "a": 1, "why": "Drowning is an oxygen problem: begin airway opening, rescue breaths and compressions immediately, in parallel with calling emergency help. Do not delay for 'draining'.", "hi": {"q": "किसी को तालाब से निकाला गया है और वह सांस नहीं ले रहा। पास खड़े व्यक्ति को क्या करना चाहिए?", "o": ["कोई मदद देने से पहले पानी निकलने का इंतज़ार", "पुनर्जीवन शुरू करें (एयरवे खोलें, बचाव सांसें, छाती दबाव) और मदद बुलाएँ", "केवल छाती दबाव दें, बचाव सांसें छोड़ दें", "उल्टा करके दौड़ें"], "a": 1, "why": "डूबना ऑक्सीजन की समस्या है: तुरंत एयरवे खोलें, बचाव सांसें और छाती दबाव शुरू करें, साथ-साथ आपात मदद बुलाएँ। 'पानी निकालने' के लिए देर न करें।"}, "kn": {"q": "ಕೆರೆಯಿಂದ ಹೊರತೆಗೆದ ವ್ಯಕ್ತಿ ಉಸಿರಾಡುತ್ತಿಲ್ಲ. ಹತ್ತಿರ ಇರುವವರು:", "o": ["ಸಹಾಯಕ್ಕೆ ಮೊದಲು ನೀರು ಹೊರಬರಲು ಕಾಯಿರಿ", "ಪುನರುಜ್ಜೀವನ ಶುರು ಮಾಡಿ (ಶ್ವಾಸಮಾರ್ಗ ತೆರೆಯಿರಿ, ರಕ್ಷಣಾ ಉಸಿರು, ಎದೆ ಒತ್ತು) ಮತ್ತು ಸಹಾಯ ಕರೆಯಿರಿ", "ಎದೆ ಒತ್ತು ಮಾತ್ರ, ರಕ್ಷಣಾ ಉಸಿರು ಬೇಡ", "ತಲೆಕೆಳಗೆ ಮಾಡಿ ಓಡಿ"], "why": "ಮುಳುಗುವಿಕೆ ಆಮ್ಲಜನಕದ ಸಮಸ್ಯೆ: ತಕ್ಷಣ ಶ್ವಾಸಮಾರ್ಗ ತೆರೆಯಿರಿ, ರಕ್ಷಣಾ ಉಸಿರು ಮತ್ತು ಎದೆ ಒತ್ತು ಶುರು ಮಾಡಿ, ಜೊತೆಗೆ ತುರ್ತು ಸಹಾಯ ಕರೆಯಿರಿ. 'ನೀರು ಹೊರಬರಲು' ತಡ ಮಾಡಬೇಡಿ.", "a": 1}}, {"id": "emergency-9", "topic": "emergency", "q": "A person touches a live electric wire and is stuck to it. The FIRST action is:", "o": ["Pull the person away with bare hands", "Switch off the power source or use a dry wooden/non-conductive stick to separate, then assess breathing", "Pour water on the wire", "Shout and wait"], "a": 1, "why": "Never touch a person still in contact with current. Cut the supply or use a dry non-conductive object, then start resuscitation if needed and refer for burns and cardiac assessment.", "hi": {"q": "कोई व्यक्ति बिजली के चालू तार को छूकर उससे चिपक गया है। पहला कदम:", "o": ["नंगे हाथों से खींच लें", "बिजली बंद करें या सूखी लकड़ी/बिजली न चलाने वाली चीज़ से अलग करें, फिर सांस जांचें", "तार पर पानी डालें", "चिल्लाकर इंतज़ार करें"], "a": 1, "why": "करंट से जुड़े व्यक्ति को कभी न छुएँ। बिजली काटें या सूखी, बिजली न चलाने वाली चीज़ का उपयोग करें, ज़रूरत हो तो पुनर्जीवन शुरू करें और जलने व दिल की जांच के लिए रेफर करें।"}, "kn": {"q": "ಒಬ್ಬ ವ್ಯಕ್ತಿ ವಿದ್ಯುತ್ ಹರಿಯುವ ತಂತಿ ಮುಟ್ಟಿ ಅಂಟಿಕೊಂಡಿದ್ದಾರೆ. ಮೊದಲ ಕ್ರಮ:", "o": ["ಬರಿಗೈಯಿಂದ ಎಳೆಯಿರಿ", "ವಿದ್ಯುತ್ ಆಫ್ ಮಾಡಿ ಅಥವಾ ಒಣ ಮರದ/ವಿದ್ಯುತ್ ಹರಿಯದ ಕೋಲಿನಿಂದ ಬೇರ್ಪಡಿಸಿ, ನಂತರ ಉಸಿರಾಟ ಪರೀಕ್ಷಿಸಿ", "ತಂತಿಯ ಮೇಲೆ ನೀರು ಸುರಿಯಿರಿ", "ಕೂಗಿ ಕಾಯಿರಿ"], "why": "ಇನ್ನೂ ವಿದ್ಯುತ್ ಸಂಪರ್ಕದಲ್ಲಿರುವ ವ್ಯಕ್ತಿಯನ್ನು ಎಂದೂ ಮುಟ್ಟಬೇಡಿ. ವಿದ್ಯುತ್ ಕಡಿತ ಮಾಡಿ ಅಥವಾ ಒಣ ವಿದ್ಯುತ್ ನಿರೋಧಕ ವಸ್ತು ಬಳಸಿ; ಬೇಕಾದರೆ ಪುನರುಜ್ಜೀವನ ಶುರು ಮಾಡಿ, ಸುಟ್ಟ ಗಾಯ ಮತ್ತು ಹೃದಯ ಪರೀಕ್ಷೆಗೆ ರೆಫರ್ ಮಾಡಿ.", "a": 1}}, {"id": "emergency-10", "topic": "emergency", "q": "In an unconscious person who IS breathing, the position of choice while arranging transport is:", "o": ["Flat on the back with a pillow under the neck", "The recovery (stable side) position to keep the airway open", "Sitting upright", "Face down on the stomach"], "a": 1, "why": "The recovery position protects the airway from vomit or the tongue in any unconscious person who is breathing, while transport is arranged.", "hi": {"q": "बेहोश व्यक्ति जिसकी सांसें चल रही हैं, उसे किस स्थिति में रखें?", "o": ["तकिये के साथ पीठ के बल", "एयरवे खुला रखने के लिए साइड (रिकवरी) स्थिति में", "बैठाकर", "पेट के बल"], "a": 1, "why": "सांस चलते हुए बेहोश व्यक्ति को रिकवरी पोजीशन (करवट) में रखें ताकि उलटी या जीभ एयरवे न रोके, और शिफ्टिंग की व्यवस्था करें।"}, "kn": {"q": "ಪ್ರಜ್ಞೆ ಇಲ್ಲದ ಆದರೆ ಉಸಿರಾಡುತ್ತಿರುವ ವ್ಯಕ್ತಿಯನ್ನು ಸಾಗಣೆ ವ್ಯವಸ್ಥೆ ಮಾಡುವಾಗ ಯಾವ ಭಂಗಿಯಲ್ಲಿ ಇಡಬೇಕು?", "o": ["ಕುತ್ತಿಗೆ ಕೆಳಗೆ ದಿಂಬಿಟ್ಟು ಬೆನ್ನಿನ ಮೇಲೆ", "ಶ್ವಾಸಮಾರ್ಗ ತೆರೆದಿರಲು ರಿಕವರಿ (ಪಕ್ಕಕ್ಕೆ) ಭಂಗಿ", "ಕೂರಿಸಿ", "ಹೊಟ್ಟೆಯ ಮೇಲೆ ಮುಖ ಕೆಳಗೆ"], "why": "ಉಸಿರಾಡುತ್ತಿರುವ ಪ್ರಜ್ಞೆ ಇಲ್ಲದ ವ್ಯಕ್ತಿಯ ಶ್ವಾಸಮಾರ್ಗವನ್ನು ವಾಂತಿ ಅಥವಾ ನಾಲಿಗೆ ತಡೆಯದಂತೆ ರಿಕವರಿ ಭಂಗಿ ರಕ್ಷಿಸುತ್ತದೆ.", "a": 1}}, {"id": "ncd-1", "topic": "ncd", "q": "A 45-year-old woman's blood pressure measures 148/94 mmHg. This reading is:", "o": ["Normal", "Elevated; she needs confirmation and management follow-up as per protocol", "Normal because she is anxious", "Only important if she has symptoms"], "a": 1, "why": "BP of 140/90 mmHg or more meets hypertension criteria. Confirm per protocol (correct technique, repeat), counsel on salt and lifestyle, and link to treatment under NPCDCS at the Health & Wellness Centre.", "hi": {"q": "45 साल की महिला का ब्लड प्रेशर 148/94 mmHg है। यह रीडिंग:", "o": ["सामान्य है", "बढ़ा हुआ है; प्रोटोकॉल के अनुसार पुष्टि और आगे इलाज की ज़रूरत है", "घबराहट के कारण सामान्य है", "केवल लक्षण होने पर ही ज़रूरी है"], "a": 1, "why": "140/90 mmHg या अधिक BP उच्च रक्तचाप की परिभाषा में आता है। प्रोटोकॉल के अनुसार पुष्टि करें (सही तरीका, दोबारा माप), नमक और जीवनशैली पर परामर्श दें, और हेल्थ एंड वेलनेस सेंटर पर इलाज से जोड़ें।"}, "kn": {"q": "45 ವರ್ಷದ ಮಹಿಳೆಯ ರಕ್ತದೊತ್ತಡ 148/94 mmHg. ಈ ಅಳತೆ:", "o": ["ಸಾಮಾನ್ಯ", "ಹೆಚ್ಚಾಗಿದೆ; ಪ್ರೋಟೋಕಾಲ್ ಪ್ರಕಾರ ದೃಢೀಕರಣ ಮತ್ತು ಮುಂದಿನ ಚಿಕಿತ್ಸೆ ಬೇಕು", "ಆತಂಕದಿಂದ ಎಂದು ಸಾಮಾನ್ಯ", "ಲಕ್ಷಣ ಇದ್ದರೆ ಮಾತ್ರ ಮುಖ್ಯ"], "why": "140/90 mmHg ಅಥವಾ ಹೆಚ್ಚು ಅಧಿಕ ರಕ್ತದೊತ್ತಡದ ಮಾನದಂಡ. ಪ್ರೋಟೋಕಾಲ್ ಪ್ರಕಾರ ದೃಢಪಡಿಸಿ (ಸರಿಯಾದ ವಿಧಾನ, ಮರು ಅಳತೆ), ಉಪ್ಪು ಮತ್ತು ಜೀವನಶೈಲಿ ಬಗ್ಗೆ ಸಲಹೆ ಕೊಡಿ, ಆರೋಗ್ಯ ಮತ್ತು ಕ್ಷೇಮ ಕೇಂದ್ರದಲ್ಲಿ ಚಿಕಿತ್ಸೆಗೆ ಜೋಡಿಸಿ.", "a": 1}}, {"id": "ncd-2", "topic": "ncd", "q": "Diabetes is diagnosed (when confirmed per protocol) with a fasting plasma glucose of:", "o": ["100 mg/dL or more", "126 mg/dL or more", "160 mg/dL or more", "200 mg/dL or more in every case"], "a": 1, "why": "Fasting plasma glucose of 126 mg/dL or more (confirmed per protocol) indicates diabetes; random glucose of 200 mg/dL with symptoms also fits. Screening is part of NCD services at HWCs.", "hi": {"q": "प्रोटोकॉल के अनुसार पुष्टि होने पर, खाली पेट प्लाज़्मा ग्लूकोज़ कितना होने पर डायबिटीज़ मानी जाती है?", "o": ["100 mg/dL या अधिक", "126 mg/dL या अधिक", "160 mg/dL या अधिक", "हर मामले में 200 mg/dL या अधिक"], "a": 1, "why": "खाली पेट 126 mg/dL या अधिक (प्रोटोकॉल से पुष्टि) डायबिटीज़ दर्शाता है; लक्षणों के साथ रैंडम ग्लूकोज़ 200 mg/dL भी। जांच HWC की NCD सेवाओं का हिस्सा है।"}, "kn": {"q": "ಪ್ರೋಟೋಕಾಲ್ ಪ್ರಕಾರ ದೃಢಪಟ್ಟಾಗ, ಖಾಲಿ ಹೊಟ್ಟೆ ಪ್ಲಾಸ್ಮಾ ಗ್ಲೂಕೋಸ್ ಎಷ್ಟಿದ್ದರೆ ಮಧುಮೇಹ?", "o": ["100 mg/dL ಅಥವಾ ಹೆಚ್ಚು", "126 mg/dL ಅಥವಾ ಹೆಚ್ಚು", "160 mg/dL ಅಥವಾ ಹೆಚ್ಚು", "ಪ್ರತಿ ಪ್ರಕರಣದಲ್ಲೂ 200 mg/dL ಅಥವಾ ಹೆಚ್ಚು"], "why": "ಖಾಲಿ ಹೊಟ್ಟೆ ಪ್ಲಾಸ್ಮಾ ಗ್ಲೂಕೋಸ್ 126 mg/dL ಅಥವಾ ಹೆಚ್ಚು (ದೃಢಪಟ್ಟರೆ) ಮಧುಮೇಹ; ಲಕ್ಷಣಗಳ ಜೊತೆ ರ್ಯಾಂಡಮ್ 200 mg/dL ಕೂಡ. ಪರೀಕ್ಷೆ HWC ಯ NCD ಸೇವೆಯ ಭಾಗ.", "a": 1}}, {"id": "ncd-3", "topic": "ncd", "q": "Under NPCDCS, routine screening of adults for hypertension and diabetes at Health & Wellness Centres targets people aged:", "o": ["18 years and above", "30 years and above", "45 years and above", "60 years and above"], "a": 1, "why": "India's NCD programme screens everyone 30 years and above annually for hypertension, diabetes and common cancers (oral, breast, cervical) at Ayushman Arogya Mandirs.", "hi": {"q": "NPCDCS के तहत हेल्थ एंड वेलनेस सेंटर पर उच्च रक्तचाप और डायबिटीज़ की नियमित जांच किस उम्र के वयस्कों की होती है?", "o": ["18 साल और अधिक", "30 साल और अधिक", "45 साल और अधिक", "60 साल और अधिक"], "a": 1, "why": "भारत का NCD कार्यक्रम आयुष्मान आरोग्य मंदिरों पर 30 साल और अधिक उम्र के सभी लोगों की हर साल उच्च रक्तचाप, डायबिटीज़ और आम कैंसर (मुँह, स्तन, गर्भाशय-ग्रीवा) की जांच करता है।"}, "kn": {"q": "NPCDCS ಅಡಿ ಆರೋಗ್ಯ ಮತ್ತು ಕ್ಷೇಮ ಕೇಂದ್ರಗಳಲ್ಲಿ ರಕ್ತದೊತ್ತಡ ಮತ್ತು ಮಧುಮೇಹ ನಿಯಮಿತ ಪರೀಕ್ಷೆ ಯಾವ ವಯಸ್ಸಿನವರಿಗೆ?", "o": ["18 ವರ್ಷ ಮತ್ತು ಮೇಲ್ಪಟ್ಟು", "30 ವರ್ಷ ಮತ್ತು ಮೇಲ್ಪಟ್ಟು", "45 ವರ್ಷ ಮತ್ತು ಮೇಲ್ಪಟ್ಟು", "60 ವರ್ಷ ಮತ್ತು ಮೇಲ್ಪಟ್ಟು"], "why": "ಭಾರತದ NCD ಕಾರ್ಯಕ್ರಮ ಆಯುಷ್ಮಾನ್ ಆರೋಗ್ಯ ಮಂದಿರಗಳಲ್ಲಿ 30 ವರ್ಷ ಮೇಲ್ಪಟ್ಟ ಎಲ್ಲರಿಗೂ ವರ್ಷಕ್ಕೊಮ್ಮೆ ರಕ್ತದೊತ್ತಡ, ಮಧುಮೇಹ ಮತ್ತು ಸಾಮಾನ್ಯ ಕ್ಯಾನ್ಸರ್ (ಬಾಯಿ, ಸ್ತನ, ಗರ್ಭಕಂಠ) ಪರೀಕ್ಷೆ ಮಾಡುತ್ತದೆ.", "a": 1}}, {"id": "ncd-4", "topic": "ncd", "q": "For cervical cancer screening in women aged 30+, the field-level test used in India's programme is:", "o": ["VIA (visual inspection of the cervix with acetic acid) every 3-5 years", "A chest X-ray", "Urine culture", "Nothing exists at field level"], "a": 0, "why": "VIA by trained providers every 3-5 years from age 30 is the recommended screen-and-treat approach in the national programme, alongside HPV vaccination of girls 9-14 years.", "hi": {"q": "30+ उम्र की महिलाओं में गर्भाशय-ग्रीवा (सर्वाइकल) कैंसर जांच के लिए भारत के कार्यक्रम में फील्ड स्तर की जांच है:", "o": ["VIA (एसिटिक एसिड से गर्भाशय-ग्रीवा की आँख से जांच) हर 3-5 साल", "छाती का एक्स-रे", "पेशाब कल्चर", "फील्ड स्तर पर कुछ नहीं है"], "a": 0, "why": "30 साल से प्रशिक्षित कर्मियों द्वारा हर 3-5 साल VIA, राष्ट्रीय कार्यक्रम का 'जांचो और इलाज करो' तरीका है, साथ में 9-14 साल की लड़कियों को HPV टीका।"}, "kn": {"q": "30+ ವಯಸ್ಸಿನ ಮಹಿಳೆಯರಲ್ಲಿ ಗರ್ಭಕಂಠ ಕ್ಯಾನ್ಸರ್ ಪರೀಕ್ಷೆಗೆ ಭಾರತದ ಕಾರ್ಯಕ್ರಮದ ಕ್ಷೇತ್ರ ಮಟ್ಟದ ಪರೀಕ್ಷೆ:", "o": ["VIA (ಅಸಿಟಿಕ್ ಆಮ್ಲದಿಂದ ಗರ್ಭಕಂಠದ ಕಣ್ಣಿನ ಪರೀಕ್ಷೆ) ಪ್ರತಿ 3-5 ವರ್ಷ", "ಎದೆಯ ಎಕ್ಸ್-ರೇ", "ಮೂತ್ರ ಕಲ್ಚರ್", "ಕ್ಷೇತ್ರ ಮಟ್ಟದಲ್ಲಿ ಏನೂ ಇಲ್ಲ"], "why": "30 ವರ್ಷದಿಂದ ತರಬೇತಿ ಪಡೆದವರಿಂದ ಪ್ರತಿ 3-5 ವರ್ಷಕ್ಕೆ VIA ರಾಷ್ಟ್ರೀಯ ಕಾರ್ಯಕ್ರಮದ 'ಪರೀಕ್ಷಿಸಿ ಮತ್ತು ಚಿಕಿತ್ಸೆ' ವಿಧಾನ; ಜೊತೆಗೆ 9-14 ವರ್ಷದ ಹುಡುಗಿಯರಿಗೆ HPV ಲಸಿಕೆ.", "a": 0}}, {"id": "ncd-5", "topic": "ncd", "q": "The most common early warning sign of breast cancer is:", "o": ["A painful red swelling with fever", "A painless lump in the breast or armpit", "Weight gain", "Nipple discharge only after feeding"], "a": 1, "why": "A painless lump is the classic early sign. Awareness and early reporting of any breast change sharply improve survival; advanced disease is far harder to treat.", "hi": {"q": "स्तन कैंसर का सबसे आम शुरुआती चेतावनी संकेत है:", "o": ["बुखार के साथ दर्द वाली लाल सूजन", "स्तन या बगल में बिना दर्द की गाँठ", "वज़न बढ़ना", "केवल दूध पिलाने के बाद निप्पल से स्राव"], "a": 1, "why": "बिना दर्द की गाँठ इसका क्लासिक शुरुआती संकेत है। स्तन में किसी भी बदलाव की जानकारी और जल्दी बताने से बचने की संभावना बहुत बढ़ती है; बढ़ी हुई बीमारी का इलाज बहुत कठिन है।"}, "kn": {"q": "ಸ್ತನ ಕ್ಯಾನ್ಸರ್‌ನ ಅತಿ ಸಾಮಾನ್ಯ ಆರಂಭಿಕ ಎಚ್ಚರಿಕೆ ಲಕ್ಷಣ:", "o": ["ಜ್ವರದ ಜೊತೆ ನೋವಿನ ಕೆಂಪು ಊತ", "ಸ್ತನ ಅಥವಾ ಕಂಕುಳಲ್ಲಿ ನೋವಿಲ್ಲದ ಗಡ್ಡೆ", "ತೂಕ ಹೆಚ್ಚುವಿಕೆ", "ಹಾಲುಣಿಸಿದ ನಂತರ ಮಾತ್ರ ಮೊಲೆತೊಟ್ಟಿನಿಂದ ಸ್ರಾವ"], "why": "ನೋವಿಲ್ಲದ ಗಡ್ಡೆ ಮುಖ್ಯ ಆರಂಭಿಕ ಲಕ್ಷಣ. ಸ್ತನದಲ್ಲಿ ಯಾವುದೇ ಬದಲಾವಣೆಯ ಅರಿವು ಮತ್ತು ಬೇಗ ತಿಳಿಸುವುದು ಬದುಕುಳಿಯುವ ಸಾಧ್ಯತೆ ಬಹಳ ಹೆಚ್ಚಿಸುತ್ತದೆ; ಮುಂದುವರಿದ ರೋಗ ಚಿಕಿತ್ಸೆ ಬಹಳ ಕಷ್ಟ.", "a": 1}}, {"id": "ncd-6", "topic": "ncd", "q": "Who should be examined for oral cancer (pre-cancerous patches and ulcers)?", "o": ["Everyone under 15", "All adults 30+ who use tobacco in any form, at annual screening", "Only people with tooth decay", "Only hospital staff"], "a": 1, "why": "Annual oral visual inspection is recommended for adults 30+ who use smoked or smokeless tobacco; early lesions are treatable while advanced cancer is not.", "hi": {"q": "मुँह के कैंसर (कैंसर-पूर्व धब्बे और छाले) की जांच किसकी होनी चाहिए?", "o": ["15 साल से कम उम्र के सभी", "सालाना जांच में किसी भी रूप में तंबाकू लेने वाले 30+ उम्र के सभी वयस्क", "केवल दाँत सड़न वाले लोग", "केवल अस्पताल कर्मचारी"], "a": 1, "why": "धूम्रपान या चबाने वाला तंबाकू लेने वाले 30+ वयस्कों के मुँह की सालाना आँख से जांच की सलाह है; शुरुआती घाव का इलाज संभव है, बढ़े कैंसर का नहीं।"}, "kn": {"q": "ಬಾಯಿ ಕ್ಯಾನ್ಸರ್ (ಕ್ಯಾನ್ಸರ್‌ಪೂರ್ವ ಮಚ್ಚೆ ಮತ್ತು ಹುಣ್ಣು) ಪರೀಕ್ಷೆ ಯಾರಿಗೆ ಮಾಡಬೇಕು?", "o": ["15 ವರ್ಷದೊಳಗಿನ ಎಲ್ಲರಿಗೂ", "ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆಯಲ್ಲಿ ಯಾವುದೇ ರೂಪದ ತಂಬಾಕು ಬಳಸುವ 30+ ವಯಸ್ಸಿನ ಎಲ್ಲಾ ವಯಸ್ಕರಿಗೆ", "ಹಲ್ಲು ಹುಳುಕು ಇರುವವರಿಗೆ ಮಾತ್ರ", "ಆಸ್ಪತ್ರೆ ಸಿಬ್ಬಂದಿಗೆ ಮಾತ್ರ"], "why": "ಧೂಮಪಾನ ಅಥವಾ ಜಗಿಯುವ ತಂಬಾಕು ಬಳಸುವ 30+ ವಯಸ್ಕರಿಗೆ ವರ್ಷಕ್ಕೊಮ್ಮೆ ಬಾಯಿಯ ಕಣ್ಣಿನ ಪರೀಕ್ಷೆ ಶಿಫಾರಸು; ಆರಂಭಿಕ ಗಾಯಗಳಿಗೆ ಚಿಕಿತ್ಸೆ ಸಾಧ್ಯ, ಮುಂದುವರಿದ ಕ್ಯಾನ್ಸರ್‌ಗೆ ಅಲ್ಲ.", "a": 1}}, {"id": "ncd-7", "topic": "ncd", "q": "WHO recommends adults limit salt (sodium) intake to less than:", "o": ["15 grams a day", "10 grams a day", "5 grams a day", "1 gram a day"], "a": 2, "why": "Less than 5 g salt (about one teaspoon) per day lowers blood pressure and cardiovascular risk. Read labels, avoid added raw salt and pickles.", "hi": {"q": "WHO वयस्कों को रोज़ नमक (सोडियम) कितने से कम लेने की सलाह देता है?", "o": ["15 ग्राम प्रतिदिन", "10 ग्राम प्रतिदिन", "5 ग्राम प्रतिदिन", "1 ग्राम प्रतिदिन"], "a": 2, "why": "रोज़ 5 ग्राम (लगभग एक छोटा चम्मच) से कम नमक ब्लड प्रेशर और हृदय रोग का जोखिम घटाता है। लेबल पढ़ें, ऊपर से कच्चा नमक और अचार कम करें।"}, "kn": {"q": "WHO ವಯಸ್ಕರಿಗೆ ದಿನಕ್ಕೆ ಉಪ್ಪು (ಸೋಡಿಯಂ) ಎಷ್ಟಕ್ಕಿಂತ ಕಡಿಮೆ ಎಂದು ಶಿಫಾರಸು ಮಾಡುತ್ತದೆ?", "o": ["ದಿನಕ್ಕೆ 15 ಗ್ರಾಂ", "ದಿನಕ್ಕೆ 10 ಗ್ರಾಂ", "ದಿನಕ್ಕೆ 5 ಗ್ರಾಂ", "ದಿನಕ್ಕೆ 1 ಗ್ರಾಂ"], "why": "ದಿನಕ್ಕೆ 5 ಗ್ರಾಂ (ಸುಮಾರು ಒಂದು ಟೀ ಚಮಚ) ಕ್ಕಿಂತ ಕಡಿಮೆ ಉಪ್ಪು ರಕ್ತದೊತ್ತಡ ಮತ್ತು ಹೃದ್ರೋಗದ ಅಪಾಯ ತಗ್ಗಿಸುತ್ತದೆ. ಲೇಬಲ್ ಓದಿ, ಮೇಲಿನಿಂದ ಹಸಿ ಉಪ್ಪು ಮತ್ತು ಉಪ್ಪಿನಕಾಯಿ ಕಡಿಮೆ ಮಾಡಿ.", "a": 2}}, {"id": "ncd-8", "topic": "ncd", "q": "Brief, structured advice from a health worker to a tobacco user:", "o": ["Has no measurable effect", "Meaningfully increases quit attempts and success and is a core HWC service", "Is pointless without a prescription", "Should wait until the user gets sick"], "a": 1, "why": "Even 3-5 minutes of brief cessation advice at every contact measurably raises quit rates; it is one of the highest-value 5-minute interventions in NCD care.", "hi": {"q": "तंबाकू लेने वाले को स्वास्थ्य कार्यकर्ता की छोटी, व्यवस्थित सलाह:", "o": ["का कोई मापने लायक असर नहीं", "छोड़ने की कोशिशें और सफलता काफी बढ़ाती है और HWC की मुख्य सेवा है", "बिना पर्चे के बेकार है", "व्यक्ति के बीमार होने तक रुकनी चाहिए"], "a": 1, "why": "हर मुलाकात पर 3-5 मिनट की छोटी सलाह भी तंबाकू छोड़ने की दर साफ़ बढ़ाती है; यह NCD देखभाल के सबसे कीमती 5-मिनट के उपायों में से है।"}, "kn": {"q": "ತಂಬಾಕು ಬಳಸುವವರಿಗೆ ಆರೋಗ್ಯ ಕಾರ್ಯಕರ್ತರ ಸಣ್ಣ, ವ್ಯವಸ್ಥಿತ ಸಲಹೆ:", "o": ["ಅಳೆಯಬಹುದಾದ ಪರಿಣಾಮ ಇಲ್ಲ", "ಬಿಡುವ ಪ್ರಯತ್ನ ಮತ್ತು ಯಶಸ್ಸನ್ನು ಗಮನಾರ್ಹವಾಗಿ ಹೆಚ್ಚಿಸುತ್ತದೆ; HWC ಯ ಮುಖ್ಯ ಸೇವೆ", "ಔಷಧಿ ಚೀಟಿ ಇಲ್ಲದೆ ವ್ಯರ್ಥ", "ವ್ಯಕ್ತಿ ಅಸ್ವಸ್ಥರಾಗುವವರೆಗೆ ಕಾಯಬೇಕು"], "why": "ಪ್ರತಿ ಭೇಟಿಯಲ್ಲಿ 3-5 ನಿಮಿಷದ ಸಣ್ಣ ಸಲಹೆಯೂ ತಂಬಾಕು ಬಿಡುವ ಪ್ರಮಾಣವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೆಚ್ಚಿಸುತ್ತದೆ; NCD ಆರೈಕೆಯಲ್ಲಿ ಅತಿ ಮೌಲ್ಯದ 5 ನಿಮಿಷದ ಕ್ರಮಗಳಲ್ಲಿ ಒಂದು.", "a": 1}}, {"id": "ipc-1", "topic": "ipc", "q": "Correct handwashing with soap and water should take at least:", "o": ["5 seconds", "10 seconds", "20 seconds, covering all surfaces including between fingers and thumbs", "A full minute"], "a": 2, "why": "At least 20 seconds with soap covering all hand surfaces is the standard; WHO's 5 Moments apply
