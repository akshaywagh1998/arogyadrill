i": {"q": "गंदी पट्टियाँ और खून से भीगी रुई का कचरा किसमें जाता है?", "o": ["पीली थैली", "नीला डिब्बा", "काला सामान्य डिब्बा", "लाल थैली"], "a": 0, "why": "रंग कोड: मानव शरीर/गंदा कचरा पीले में, संक्रमित रीसायकल होने वाला लाल में, नुकीली चीज़ें सफेद पारदर्शी में, काँच/धातु के इम्प्लांट नीले में।"}, "kn": {"q": "ಕೊಳಕಾದ ಡ್ರೆಸ್ಸಿಂಗ್ ಮತ್ತು ರಕ್ತದಿಂದ ನೆನೆದ ಹತ್ತಿ ಕಸ ಯಾವುದರಲ್ಲಿ?", "o": ["ಹಳದಿ ಚೀಲ", "ನೀಲಿ ಡಬ್ಬಿ", "ಕಪ್ಪು ಸಾಮಾನ್ಯ ಬುಟ್ಟಿ", "ಕೆಂಪು ಚೀಲ"], "why": "ಬಣ್ಣ ಸಂಕೇತ: ಮಾನವ ದೇಹದ/ಕೊಳಕು ಕಸ ಹಳದಿ, ಸೋಂಕಿತ ಮರುಬಳಕೆ ವಸ್ತು ಕೆಂಪು, ಚೂಪಾದ ವಸ್ತು ಬಿಳಿ ಪಾರದರ್ಶಕ, ಗಾಜು/ಲೋಹದ ಇಂಪ್ಲಾಂಟ್ ನೀಲಿ.", "a": 0}}, {"id": "ipc-4", "topic": "ipc", "q": "Alcohol-based hand rub is NOT sufficient when hands are:", "o": ["Before giving an injection", "Visibly dirty or soiled", "After removing gloves", "Before touching a newborn"], "a": 1, "why": "Alcohol rub fails on visibly soiled hands and against some organisms (e.g., after caring for C. difficile); wash with soap and water in those cases.", "hi": {"q": "अल्कोहल वाला हैंड रब कब पर्याप्त नहीं है?", "o": ["इंजेक्शन देने से पहले", "जब हाथ साफ़ दिखने में गंदे हों", "दस्ताने उतारने के बाद", "नवजात को छूने से पहले"], "a": 1, "why": "दिखने में गंदे हाथों पर और कुछ जीवाणुओं (जैसे C. difficile की देखभाल के बाद) पर अल्कोहल रब काम नहीं करता; ऐसे में साबुन और पानी से धोएँ।"}, "kn": {"q": "ಆಲ್ಕೋಹಾಲ್ ಹ್ಯಾಂಡ್ ರಬ್ ಯಾವಾಗ ಸಾಲದು?", "o": ["ಇಂಜೆಕ್ಷನ್ ಕೊಡುವ ಮೊದಲು", "ಕೈ ಕಣ್ಣಿಗೆ ಕಾಣುವಂತೆ ಕೊಳಕಾಗಿದ್ದಾಗ", "ಕೈಗವಸು ತೆಗೆದ ನಂತರ", "ನವಜಾತ ಶಿಶು ಮುಟ್ಟುವ ಮೊದಲು"], "why": "ಕಾಣುವಂತೆ ಕೊಳಕಾದ ಕೈಗಳ ಮೇಲೆ ಮತ್ತು ಕೆಲವು ಜೀವಿಗಳ ವಿರುದ್ಧ (ಉದಾ. C. difficile ಆರೈಕೆ ನಂತರ) ಆಲ್ಕೋಹಾಲ್ ರಬ್ ಕೆಲಸ ಮಾಡುವುದಿಲ್ಲ; ಆಗ ಸಾಬೂನು-ನೀರಿನಿಂದ ತೊಳೆಯಿರಿ.", "a": 1}}, {"id": "ipc-5", "topic": "ipc", "q": "For aerosol-generating procedures on a suspected respiratory infection patient, the correct mask is:", "o": ["Cloth mask", "Surgical mask", "N95 (or equivalent respirator)", "No mask needed with good ventilation"], "a": 2, "why": "Aerosol-generating procedures require a fit-tested N95/respirator, eye protection, gown and gloves. Surgical masks suffice for routine droplet precautions.", "hi": {"q": "संदिग्ध सांस संक्रमण वाले मरीज़ पर एरोसोल बनाने वाली प्रक्रिया के लिए सही मास्क है:", "o": ["कपड़े का मास्क", "सर्जिकल मास्क", "N95 (या समकक्ष रेस्पिरेटर)", "अच्छे वेंटिलेशन में मास्क की ज़रूरत नहीं"], "a": 2, "why": "एरोसोल बनाने वाली प्रक्रियाओं में फिट-टेस्टेड N95/रेस्पिरेटर, आँखों की सुरक्षा, गाउन और दस्ताने चाहिए। सामान्य ड्रॉपलेट सावधानी के लिए सर्जिकल मास्क काफी है।"}, "kn": {"q": "ಶಂಕಿತ ಉಸಿರಾಟ ಸೋಂಕಿನ ರೋಗಿಯ ಮೇಲೆ ಏರೋಸಾಲ್ ಉಂಟುಮಾಡುವ ಪ್ರಕ್ರಿಯೆಗೆ ಸರಿಯಾದ ಮಾಸ್ಕ್:", "o": ["ಬಟ್ಟೆ ಮಾಸ್ಕ್", "ಸರ್ಜಿಕಲ್ ಮಾಸ್ಕ್", "N95 (ಅಥವಾ ಸಮಾನ ರೆಸ್ಪಿರೇಟರ್)", "ಉತ್ತಮ ಗಾಳಿ ಇದ್ದರೆ ಮಾಸ್ಕ್ ಬೇಡ"], "why": "ಏರೋಸಾಲ್ ಉಂಟುಮಾಡುವ ಪ್ರಕ್ರಿಯೆಗಳಿಗೆ ಫಿಟ್-ಟೆಸ್ಟ್ ಮಾಡಿದ N95/ರೆಸ್ಪಿರೇಟರ್, ಕಣ್ಣಿನ ರಕ್ಷಣೆ, ಗೌನ್ ಮತ್ತು ಕೈಗವಸು ಬೇಕು. ಸಾಮಾನ್ಯ ಹನಿ ಎಚ್ಚರಿಕೆಗೆ ಸರ್ಜಿಕಲ್ ಮಾಸ್ಕ್ ಸಾಕು.", "a": 2}}, {"id": "ipc-6", "topic": "ipc", "q": "A health worker sustains a needle-stick injury. The immediate correct steps are:", "o": ["Squeeze the wound hard and continue work", "Wash with soap and running water, do not squeeze, report it and get assessed for post-exposure prophylaxis (HIV/HBV)", "Apply mud or turmeric", "Ignore it if the needle was clean"], "a": 1, "why": "Wash with soap and water, let it bleed freely, cover it, report at once and get PEP assessment. Hepatitis B vaccine status of the worker should be on record.", "hi": {"q": "एक स्वास्थ्य कर्मी को सुई चुभ जाती है। तुरंत सही कदम हैं:", "o": ["घाव को ज़ोर से दबाकर काम जारी रखें", "साबुन और बहते पानी से धोएँ, दबाएँ नहीं, तुरंत बताएँ और पोस्ट-एक्सपोज़र प्रोफिलैक्सिस (HIV/HBV) की जांच कराएँ", "मिट्टी या हल्दी लगाएँ", "सुई साफ़ थी तो अनदेखा करें"], "a": 1, "why": "साबुन-पानी से धोएँ, खून अपने आप बहने दें, ढकें, तुरंत रिपोर्ट करें और PEP की जांच कराएँ। कर्मी की हेपेटाइटिस B टीका स्थिति रिकॉर्ड में होनी चाहिए।"}, "kn": {"q": "ಆರೋಗ್ಯ ಕಾರ್ಯಕರ್ತರಿಗೆ ಸೂಜಿ ಚುಚ್ಚಿದೆ. ತಕ್ಷಣದ ಸರಿಯಾದ ಕ್ರಮಗಳು:", "o": ["ಗಾಯವನ್ನು ಬಲವಾಗಿ ಹಿಂಡಿ ಕೆಲಸ ಮುಂದುವರಿಸಿ", "ಸಾಬೂನು ಮತ್ತು ಹರಿಯುವ ನೀರಿನಿಂದ ತೊಳೆಯಿರಿ, ಹಿಂಡಬೇಡಿ, ತಕ್ಷಣ ತಿಳಿಸಿ, ಪೋಸ್ಟ್-ಎಕ್ಸ್‌ಪೋಶರ್ ಪ್ರೊಫಿಲ್ಯಾಕ್ಸಿಸ್ (HIV/HBV) ಪರಿಶೀಲನೆ ಮಾಡಿಸಿ", "ಮಣ್ಣು ಅಥವಾ ಅರಿಶಿನ ಹಚ್ಚಿ", "ಸೂಜಿ ಸ್ವಚ್ಛವಾಗಿದ್ದರೆ ಬಿಟ್ಟುಬಿಡಿ"], "why": "ಸಾಬೂನು-ನೀರಿನಿಂದ ತೊಳೆಯಿರಿ, ರಕ್ತ ತಾನಾಗಿ ಹರಿಯಲಿ, ಮುಚ್ಚಿ, ತಕ್ಷಣ ವರದಿ ಮಾಡಿ, PEP ಪರಿಶೀಲನೆ ಮಾಡಿಸಿ. ಕಾರ್ಯಕರ್ತರ ಹೆಪಟೈಟಿಸ್ B ಲಸಿಕೆ ಸ್ಥಿತಿ ದಾಖಲೆಯಲ್ಲಿರಬೇಕು.", "a": 1}}, {"id": "ipc-7", "topic": "ipc", "q": "Reuse of a needle between patients:", "o": ["Is acceptable if wiped with spirit", "Is never acceptable; needles are single-use", "Is fine for vaccine carriers", "Depends on the shortage"], "a": 1, "why": "Needles and lancets are single-use devices. Reuse transmits HIV and hepatitis; injection safety is a core primary-care standard.", "hi": {"q": "मरीज़ों के बीच सुई का दोबारा उपयोग:", "o": ["स्पिरिट से पोंछकर ठीक है", "कभी ठीक नहीं; सुइयाँ एक बार उपयोग की होती हैं", "वैक्सीन कैरियर के लिए ठीक है", "कमी पर निर्भर है"], "a": 1, "why": "सुइयाँ और लैंसेट एक बार उपयोग के उपकरण हैं। दोबारा उपयोग से HIV और हेपेटाइटिस फैलते हैं; सुरक्षित इंजेक्शन प्राथमिक देखभाल का मुख्य मानक है।"}, "kn": {"q": "ರೋಗಿಗಳ ನಡುವೆ ಸೂಜಿಯ ಮರುಬಳಕೆ:", "o": ["ಸ್ಪಿರಿಟ್‌ನಿಂದ ಒರೆಸಿದರೆ ಸರಿ", "ಎಂದೂ ಸರಿಯಲ್ಲ; ಸೂಜಿ ಒಂದೇ ಬಳಕೆಯದು", "ಲಸಿಕೆ ಕ್ಯಾರಿಯರ್‌ಗೆ ಸರಿ", "ಕೊರತೆಯನ್ನು ಅವಲಂಬಿಸಿದೆ"], "why": "ಸೂಜಿ ಮತ್ತು ಲ್ಯಾನ್ಸೆಟ್ ಒಂದೇ ಬಳಕೆಯ ಸಾಧನ. ಮರುಬಳಕೆ HIV ಮತ್ತು ಹೆಪಟೈಟಿಸ್ ಹರಡುತ್ತದೆ; ಸುರಕ್ಷಿತ ಇಂಜೆಕ್ಷನ್ ಪ್ರಾಥಮಿಕ ಆರೈಕೆಯ ಮುಖ್ಯ ಮಾನದಂಡ.", "a": 1}}, {"id": "ipc-8", "topic": "ipc", "q": "The most reliable way to break the chain of respiratory infections like TB, COVID-19 and influenza in a clinic is:", "o": ["Air fresheners and fans only", "Cough etiquette, masks for symptomatic patients, ventilation and hand hygiene together", "Scented candles", "Keeping windows shut"], "a": 1, "why": "Layered measures work: cover-the-cough etiquette, early masking of symptomatic patients, cross-ventilation and hand hygiene reduce transmission sharply.", "hi": {"q": "क्लिनिक में TB, COVID-19 और इन्फ्लूएंज़ा जैसे सांस के संक्रमण की कड़ी तोड़ने का सबसे भरोसेमंद तरीका:", "o": ["केवल एयर फ्रेशनर और पंखे", "खाँसी शिष्टाचार, लक्षण वाले मरीज़ों को मास्क, हवादार कमरे और हाथों की सफाई एक साथ", "सुगंधित मोमबत्तियाँ", "खिड़कियाँ बंद रखना"], "a": 1, "why": "कई उपाय साथ में काम करते हैं: खाँसते समय मुँह ढकना, लक्षण वाले मरीज़ों को जल्दी मास्क, क्रॉस-वेंटिलेशन और हाथों की सफाई संक्रमण को तेज़ी से घटाते हैं।"}, "kn": {"q": "ಕ್ಲಿನಿಕ್‌ನಲ್ಲಿ TB, COVID-19, ಇನ್‌ಫ್ಲುಯೆಂಜಾದಂತಹ ಉಸಿರಾಟ ಸೋಂಕಿನ ಸರಪಳಿ ಮುರಿಯಲು ಅತಿ ನಂಬಿಕೆಯ ಮಾರ್ಗ:", "o": ["ಏರ್ ಫ್ರೆಶ್ನರ್ ಮತ್ತು ಫ್ಯಾನ್ ಮಾತ್ರ", "ಕೆಮ್ಮಿನ ಶಿಷ್ಟಾಚಾರ, ಲಕ್ಷಣ ಇರುವ ರೋಗಿಗಳಿಗೆ ಮಾಸ್ಕ್, ಗಾಳಿ ಸಂಚಾರ ಮತ್ತು ಕೈ ಸ್ವಚ್ಛತೆ ಒಟ್ಟಿಗೆ", "ಸುಗಂಧ ಮೇಣದಬತ್ತಿ", "ಕಿಟಕಿ ಮುಚ್ಚಿಡುವುದು"], "why": "ಹಲವು ಕ್ರಮಗಳು ಒಟ್ಟಿಗೆ ಕೆಲಸ ಮಾಡುತ್ತವೆ: ಕೆಮ್ಮುವಾಗ ಮುಚ್ಚುವುದು, ಲಕ್ಷಣ ಇರುವವರಿಗೆ ಬೇಗ ಮಾಸ್ಕ್, ಅಡ್ಡ ಗಾಳಿ ಸಂಚಾರ ಮತ್ತು ಕೈ ಸ್ವಚ್ಛತೆ ಹರಡುವಿಕೆಯನ್ನು ಬಹಳ ತಗ್ಗಿಸುತ್ತವೆ.", "a": 1}}];

let S = load();
function load(){
  try{ return JSON.parse(localStorage.getItem("arogyaDrill")) || fresh(); }catch(e){ return fresh(); }
}
function fresh(){ return {lang:"en",goal:10,day:"",streak:0,doneToday:0,cards:{},log:[],seen:0,correct:0}; }
function save(){ localStorage.setItem("arogyaDrill", JSON.stringify(S)); }
const DAY = 864e5;
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function loc(q){ return (S.lang!=="en"&&q[S.lang])?q[S.lang]:q; }
function tname(k){ return TOPICS[k][S.lang]||TOPICS[k].en; }
const LANGS=["en","hi","kn"], LANG_LABEL={en:"EN",hi:"हिं",kn:"ಕ"};
function t(k){ return (I18N[S.lang]||I18N.en)[k] || I18N.en[k] || k; }
function card(id){ return S.cards[id]; }
function isDue(id){ const c=card(id); return !c || c.due<=Date.now(); }
function isNew(id){ return !card(id); }
function mastered(id){ const c=card(id); return c && c.reps>=3 && c.interval>=21; }
function topicStats(tp){
  const items=QUESTIONS.filter(x=>x.topic===tp);
  return {total:items.length, m:items.filter(x=>mastered(x.id)).length, due:items.filter(x=>isDue(x.id)&&!isNew(x.id)).length, fresh:items.filter(x=>isNew(x.id)).length};
}
function weakestTopic(){
  const ks=Object.keys(TOPICS);
  let best=ks[0], br=2;
  for(const k of ks){ const s=topicStats(k); const r=s.total? s.m/s.total : 0; if(r<br){br=r;best=k;} }
  return best;
}
function buildQueue(){
  const due=QUESTIONS.filter(x=>isDue(x.id)&&!isNew(x.id)).sort((a,b)=>card(a.id).due-card(b.id).due);
  let q=due.slice(0, S.goal);
  let left=S.goal-q.length;
  if(left>0){
    // new items, weakest topics first
    const newItems=QUESTIONS.filter(x=>isNew(x.id));
    newItems.sort((a,b)=> (a.topic===weakestTopic()? -1:1) - (b.topic===weakestTopic()? -1:1));
    const wk=newItems.filter(x=>x.topic===weakestTopic());
    const rest=newItems.filter(x=>x.topic!==weakestTopic());
    q=q.concat(wk.slice(0,left), rest.slice(0, Math.max(0,left-wk.length)));
  }
  return q;
}
function answer(id, ok){
  const now=Date.now();
  const c=card(id)||{reps:0,ease:2.5,interval:0,due:now};
  S.seen++;
  if(ok){
    S.correct++;
    c.reps++;
    c.interval = c.reps===1?1: c.reps===2?3: Math.max(1,Math.round(c.interval*c.ease));
    c.ease = Math.min(2.8, c.ease+0.05);
    c.due = now + c.interval*DAY;
    S.log = S.log.filter(e=>e.id!==id);
  } else {
    c.reps=0; c.ease=Math.max(1.3,c.ease-0.2); c.interval=1; c.due=now+10*60e3;
    if(!S.log.some(e=>e.id===id)) S.log.push({id,at:now});
  }
  S.cards[id]=c;
  // streak
  if(S.day!==today()){ const y=new Date(Date.now()-DAY); const yd=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0"); S.streak = S.day===yd ? (S.streak||0)+1 : 1; S.day=today(); S.doneToday=0; }
  S.doneToday++;
  save();
}
function liveStreak(){ const y=new Date(Date.now()-DAY); const yd=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0"); return (S.day===today()||S.day===yd)?(S.streak||0):0; }
function grade(){ return S.seen? Math.round(100*S.correct/S.seen)+"%":"–"; }

/* ---------- UI ---------- */
let LANG_HTML={};
function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.innerHTML = t(el.dataset.i18n); });
  const tg=document.querySelector(".logo .s"); if(tg) tg.textContent=t("tag");
  document.getElementById("langbtn").textContent = LANGS.map(l=>l===S.lang?"["+LANG_LABEL[l]+"]":LANG_LABEL[l]).join(" · ");
  document.documentElement.lang = S.lang;
  render();
}
function toggleLang(){ S.lang = LANGS[(LANGS.indexOf(S.lang)+1)%LANGS.length]; save(); applyLang(); }
function show(v){
  ["today","topics","progress","about"].forEach(x=>{
    document.getElementById("view-"+x).classList.toggle("hidden",x!==v);
    document.getElementById("tab-"+x).classList.toggle("active",x===v);
  });
  window.scrollTo(0,0); render();
}
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),2200); }
function render(){
  // today
  const dueN=QUESTIONS.filter(x=>isDue(x.id)&&!isNew(x.id)).length;
  const newN=QUESTIONS.filter(x=>isNew(x.id)).length;
  document.getElementById("stDue").textContent=dueN;
  document.getElementById("stNew").textContent=newN;
  document.getElementById("stStreak").textContent=liveStreak();
  document.getElementById("todaySub").textContent = S.day===today()
    ? (S.doneToday>=S.goal ? t("todayDone") : (S.goal-S.doneToday)+" "+t("qcount"))
    : "";
  document.getElementById("queueNote").textContent = t("timed");
  document.getElementById("goalSel").value=String(S.goal);
  const sb=document.getElementById("startBtn");
  sb.textContent = (S.day===today() && S.doneToday>=S.goal) ? t("startBtn")+" +" : t("startBtn");
  // topics
  const tl=document.getElementById("topicList"); tl.innerHTML="";
  for(const k of Object.keys(TOPICS)){
    const s=topicStats(k); const pct=s.total?Math.round(100*s.m/s.total):0;
    const chip = s.due? `<span class="chip due">${t("due")} ${s.due}</span>` : s.fresh? `<span class="chip new">${t("fresh")}</span>` : `<span class="chip ok">${t("master")}</span>`;
    const d=document.createElement("div"); d.className="topic";
    d.innerHTML=`<div class="em">${TOPICS[k].em}</div><div class="tx"><b>${tname(k)}</b>
      <span>${s.m}/${s.total} ${t("master")} · ${s.total} ${t("qcount")}</span><div class="bar"><i style="width:${pct}%"></i></div></div>
      <div style="text-align:right">${chip}<button class="btn ghost small" style="margin-top:8px" onclick="drillTopic('${k}')">▶</button></div>`;
    tl.appendChild(d);
  }
  // progress
  document.getElementById("pgAcc").textContent=grade();
  document.getElementById("pgSeen").textContent=S.seen;
  document.getElementById("pgMast").textContent=QUESTIONS.filter(x=>mastered(x.id)).length;
  const ll=document.getElementById("logList");
  if(!S.log.length){ ll.innerHTML=`<div class="logrow sub">${t("noMistakes")}</div>`; document.getElementById("logBtn").style.display="none"; }
  else{
    document.getElementById("logBtn").style.display="";
    ll.innerHTML=S.log.slice().reverse().map(e=>{
      const q=QUESTIONS.find(x=>x.id===e.id); if(!q) return "";
      const cur=loc(q);
      return `<div class="logrow"><b>${cur.q}</b><div class="why">✔ ${cur.o[q.a]} — ${cur.why}</div></div>`;
    }).join("");
  }
}
/* ---------- drill ---------- */
let queue=[], qi=0, answered=0, session=[];
function openDrill(list){
  if(!list.length){ toast(t("noMistakes")); return; }
  queue=list; qi=0; answered=0; session=[];
  document.getElementById("drill").classList.add("open"); showQ();
}
function startToday(){
  let q=buildQueue();
  if(S.day===today() && S.doneToday>=S.goal){ // extra practice: weakest topic new
    const wk=QUESTIONS.filter(x=>x.topic===weakestTopic());
    q=wk.sort(()=>Math.random()-.5).slice(0,S.goal);
  }
  openDrill(q);
}
function drillTopic(k){
  const items=QUESTIONS.filter(x=>x.topic===k);
  const due=items.filter(x=>isDue(x.id)&&!isNew(x.id)).sort((a,b)=>card(a.id).due-card(b.id).due);
  const rest=items.filter(x=>!due.includes(x)).sort(()=>Math.random()-.5);
  openDrill(due.concat(rest).slice(0,Math.max(S.goal,10)));
}
function drillErrors(){ openDrill(S.log.map(e=>QUESTIONS.find(x=>x.id===e.id)).filter(Boolean)); }
function showQ(){
  const q=queue[qi]; const cur=loc(q);
  document.getElementById("dprog").style.width=(qi/queue.length*100)+"%";
  document.getElementById("dqTopic").textContent=tname(q.topic)+" · "+t("pick");
  document.getElementById("dqText").textContent=cur.q;
  const fb=document.getElementById("dqFb"); fb.style.display="none"; fb.className="fb";
  document.getElementById("nextBtn").classList.add("hidden");
  const box=document.getElementById("dqOpts"); box.innerHTML="";
  cur.o.forEach((opt,i)=>{
    const b=document.createElement("button"); b.className="opt";
    b.innerHTML=`<b class="k">${"ABCD"[i]}</b><span>${opt}</span>`;
    b.onclick=()=>pick(i,b); box.appendChild(b);
  });
  startTimer();
}
let timerInt=null;
function startTimer(){
  clearInterval(timerInt); let s=60;
  const el=document.getElementById("dtimer"); el.textContent="1:00"; el.style.color="var(--muted)";
  timerInt=setInterval(()=>{ s--; el.textContent="0:"+String(s).padStart(2,"0");
    if(s<=10) el.style.color="var(--red)";
    if(s<=0){ clearInterval(timerInt); el.textContent="0:00"; } },1000);
}
function pick(i,btn){
  clearInterval(timerInt);
  const q=queue[qi]; const cur=loc(q);
  const ok=i===cur.a;
  document.querySelectorAll("#dqOpts .opt").forEach((b,j)=>{
    b.disabled=true;
    if(j===cur.a) b.classList.add("correct");
    else if(j===i) b.classList.add("wrong");
  });
  answer(q.id, ok); answered++;
  const fb=document.getElementById("dqFb");
  fb.className="fb "+(ok?"good":"bad"); fb.style.display="block";
  fb.innerHTML=`<div class="ttl">${ok?"✓ "+t("correct"):"✕ "+t("wrong")}</div>${cur.why}`;
  const nb=document.getElementById("nextBtn"); nb.classList.remove("hidden");
  nb.textContent = qi+1<queue.length ? t("next") : "🏁 "+t("done");
  nb.focus();
}
function nextQ(){
  if(qi+1<queue.length){ qi++; showQ(); }
  else{ endDrill(); }
}
function endDrill(){
  document.getElementById("drill").classList.remove("open");
  clearInterval(timerInt);
  show("progress");
  if(answered) toast(t("done"));
}
/* init */
document.getElementById("goalSel").addEventListener("change",e=>{ S.goal=parseInt(e.target.value); save(); render(); });
applyLang();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
